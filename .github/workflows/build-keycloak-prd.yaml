name: Build/Deploy Keycloak das Casas (prd)

# ADR-0025, docs/27 secao 9, passo 1: o Keycloak das Casas passa a rodar a imagem de `apps/keycloak/Dockerfile` (a mesma
# 26.0.0 + o diretorio do tema `oplenario`). Mesma versao, mesmo banco, mesmas variaveis e o mesmo comando do app no
# Dokploy: so' a imagem muda.
#
# 1. publica a imagem no GHCR (`:latest` e `:<sha>`; o Dokploy recebe a do sha, que nao muda por baixo dele);
# 2. acha o app do Keycloak das Casas no Dokploy PELO DOMINIO (o do operador e' outro Keycloak, ADR-0016, e nao e'
#    tocado). Sem exatamente um app com esse dominio, para sem mexer em nada e lista o que viu;
# 3. guarda a imagem e o acesso ao registro que o app tinha, troca para a nova e reimplanta;
# 4. confere pelo Keycloak (serverinfo do admin) que o tema `oplenario` esta' carregado. Se nao aparecer, VOLTA a imagem
#    anterior, reimplanta e falha.
#
# Depois disto, os realms das Camaras usam o tema quando a configuracao de login e' reaplicada (reaplicar-login-prd).

on:
  push:
    branches: ["production"]
    paths:
      - "apps/keycloak/**"
      - ".github/workflows/build-keycloak-prd.yaml"
  workflow_dispatch:

env:
  DOMINIO_KC: keycloak.calvetec.com.br
  KC: https://keycloak.calvetec.com.br
  REPO_IMAGEM: ghcr.io/gondwanadev/oplenario-keycloak-prd

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-keycloak-prd
      # false: cancelar entre a troca e a conferencia deixaria o app com a imagem nova sem ninguem para voltar atras
      cancel-in-progress: false
    env:
      DK: https://${{ vars.DOKPLOY_DOMAIN }}/api
      DK_KEY: ${{ secrets.DOKPLOY_KEY }}
      APP_CORE: ${{ secrets.DOKPLOY_APPLICATION_ID_API }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/keycloak
          file: ./apps/keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.REPO_IMAGEM }}:latest
            ${{ env.REPO_IMAGEM }}:${{ github.sha }}
          platforms: linux/amd64

      - name: Achar o Keycloak das Casas no Dokploy
        id: app
        run: |
          set -euo pipefail
          umask 077
          get() { curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/$1"; }
          ids=$(get project.all | jq -r '[.. | objects | select(has("applicationId")) | .applicationId] | unique | .[]')
          achados=()
          for id in $ids; do
            get "application.one?applicationId=$id" > "$RUNNER_TEMP/app.json"
            # so' o que parece Keycloak vai ao log (o Dokploy tem apps de outros projetos)
            jq -r 'select((.appName // "") + (.name // "") + (.dockerImage // "") | test("keycloak"; "i"))
                   | "app: \(.appName)\t\(.sourceType // "?")\t\(.dockerImage // "-")\t\([.domains[]?.host] | join(","))"' \
              "$RUNNER_TEMP/app.json"
            if jq -e --arg d "$DOMINIO_KC" '[.domains[]?.host] | index($d)' "$RUNNER_TEMP/app.json" > /dev/null; then
              achados+=("$id")
              cp "$RUNNER_TEMP/app.json" "$RUNNER_TEMP/keycloak.json"
            fi
          done
          rm -f "$RUNNER_TEMP/app.json"
          if [ "${#achados[@]}" -ne 1 ]; then
            echo "::error::esperava 1 app com o dominio $DOMINIO_KC no Dokploy, achei ${#achados[@]}: nada foi trocado"
            exit 1
          fi
          tipo=$(jq -r '.sourceType // ""' "$RUNNER_TEMP/keycloak.json")
          if [ "$tipo" != "docker" ]; then
            echo "::error::o app do Keycloak nao usa imagem Docker (sourceType=$tipo): nada foi trocado"
            exit 1
          fi
          id="${achados[0]}"
          echo "::add-mask::$id"
          senha=$(jq -r '.password // ""' "$RUNNER_TEMP/keycloak.json")
          [ -n "$senha" ] && echo "::add-mask::$senha"
          # o que o app tinha, para voltar atras (o acesso ao registro como estava; nulo vira texto vazio, que o Dokploy
          # le como "sem login", igual ao nulo)
          jq --arg id "$id" '{applicationId: $id, dockerImage, username: (.username // ""), password: (.password // ""),
                              registryUrl: (.registryUrl // "")}' \
            "$RUNNER_TEMP/keycloak.json" > "$RUNNER_TEMP/anterior.json"
          echo "imagem atual: $(jq -r '.dockerImage' "$RUNNER_TEMP/anterior.json")"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/keycloak.json"

      # O acesso ao GHCR: o mesmo que a API ja' usa no Dokploy, se ela o guarda no app; senao, o token do GHCR daqui.
      - name: Trocar a imagem e reimplantar
        env:
          ID: ${{ steps.app.outputs.id }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ATOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          get() { curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/$1"; }
          post() { curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" -H 'Content-Type: application/json' -d @- "$DK/$1" > /dev/null; }
          get "application.one?applicationId=$APP_CORE" | jq '{username, password, registryUrl}' > "$RUNNER_TEMP/acesso.json"
          if [ -n "$(jq -r '.username // ""' "$RUNNER_TEMP/acesso.json")" ]; then
            echo "acesso ao registro: o da API"
          else
            echo "acesso ao registro: o token do GHCR"
            jq -n --arg u "$ATOR" --arg p "$GHCR_TOKEN" '{username: $u, password: $p, registryUrl: "ghcr.io"}' > "$RUNNER_TEMP/acesso.json"
          fi
          jq --arg id "$ID" --arg img "$REPO_IMAGEM:$SHA" '. + {applicationId: $id, dockerImage: $img}' \
            "$RUNNER_TEMP/acesso.json" | post application.saveDockerProvider
          rm -f "$RUNNER_TEMP/acesso.json"
          jq -n --arg id "$ID" '{applicationId: $id}' | post application.deploy
          echo "deploy disparado: $REPO_IMAGEM:$SHA"

      - name: Conferir o tema no Keycloak (ou voltar atras)
        env:
          ID: ${{ steps.app.outputs.id }}
          KC_SENHA: ${{ secrets.HML_KEYCLOAK_ADMIN_SENHA }}
        run: |
          set -uo pipefail
          tem_tema() {
            local t
            t=$(curl -sf --max-time 15 -d client_id=admin-cli -d username=admin --data-urlencode "password=$KC_SENHA" \
                  -d grant_type=password "$KC/realms/master/protocol/openid-connect/token" | jq -r '.access_token // empty') || return 1
            [ -n "$t" ] || return 1
            curl -sf --max-time 15 -H "Authorization: Bearer $t" "$KC/admin/serverinfo" \
              | jq -e '[.themes.login[]?.name] | index("oplenario")' > /dev/null
          }
          for i in $(seq 1 48); do
            if tem_tema; then echo "tema oplenario carregado no Keycloak (tentativa $i)"; exit 0; fi
            sleep 15
          done
          echo "::error::o tema nao apareceu em 12 min: voltando a imagem anterior"
          if ! curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" -H 'Content-Type: application/json' \
                 -d @"$RUNNER_TEMP/anterior.json" "$DK/application.saveDockerProvider" > /dev/null; then
            echo "::error::o Dokploy recusou a volta da imagem: trocar a mao para $(jq -r '.dockerImage' "$RUNNER_TEMP/anterior.json")"
            exit 1
          fi
          if ! jq -n --arg id "$ID" '{applicationId: $id}' | curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" \
                 -H 'Content-Type: application/json' -d @- "$DK/application.deploy" > /dev/null; then
            echo "::error::a imagem anterior foi gravada, mas o deploy nao foi disparado: reimplantar no Dokploy"
            exit 1
          fi
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 15 "$KC/realms/master"; then
              echo "Keycloak de volta com a imagem anterior ($(jq -r '.dockerImage' "$RUNNER_TEMP/anterior.json"))"
              exit 1
            fi
            sleep 15
          done
          echo "::error::o Keycloak nao voltou em 10 min depois da troca de volta: conferir no Dokploy AGORA"
          exit 1

      - name: Limpar
        if: always()
        run: rm -f "$RUNNER_TEMP/anterior.json" "$RUNNER_TEMP/acesso.json" "$RUNNER_TEMP/keycloak.json" "$RUNNER_TEMP/app.json"
