name: Build/Deploy Keycloak das Casas (prd)

# ADR-0025, docs/27 secao 9, passo 1: o Keycloak das Casas passa a rodar a imagem de `apps/keycloak/Dockerfile` (a mesma
# 26.0.0 + o diretorio do tema `oplenario`). Mesma versao, mesmo banco, mesmas variaveis e o mesmo comando: so' a imagem
# muda.
#
# 1. publica a imagem no GHCR (`:latest` e `:<sha>`; o Dokploy recebe a do sha, que nao muda por baixo dele);
# 2. acha no Dokploy o COMPOSE do Keycloak das Casas pelo nome do container que a API usa (KEYCLOAK_BASE_URL da API); o
#    Keycloak do operador e' outro (ADR-0016) e nao e' tocado. Sem exatamente um, para sem mexer em nada;
# 3. guarda o compose como estava, troca so' a linha `image:` do Keycloak e reimplanta;
# 4. confere pelo Keycloak (serverinfo do admin) que o tema `oplenario` esta' carregado. Se nao aparecer em 12 min,
#    VOLTA o compose anterior, reimplanta e falha.
#
# Os realms usam o tema pelo `loginTheme` que o reaplicar-login-prd grava (antes do tema chegar, o Keycloak cai no
# padrao, com um erro no log dele).

# So' a mao: a troca reinicia o Keycloak das Casas (todo login para enquanto ele sobe) e ja' derrubou o login uma vez
# (05/10/2026). Mudou o tema em apps/keycloak? Promover e rodar este workflow, com a frase de confirmacao.
on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite trocar-keycloak para confirmar (o Keycloak das Casas reinicia)'
        required: true
        type: string

env:
  KC: https://keycloak.calvetec.com.br
  REPO_IMAGEM: ghcr.io/gondwanadev/oplenario-keycloak-prd

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-keycloak-prd
      # false: cancelar entre a troca e a conferencia deixaria o app com a imagem nova sem ninguem para voltar atras
      cancel-in-progress: false
    env:
      DK: https://${{ vars.DOKPLOY_DOMAIN }}/api
      DK_KEY: ${{ secrets.DOKPLOY_KEY }}
      APP_CORE: ${{ secrets.DOKPLOY_APPLICATION_ID_API }}
    steps:
      - name: Guarda de confirmacao
        env:
          CONFIRMAR: ${{ inputs.confirmar }}
        run: '[ "$CONFIRMAR" = "trocar-keycloak" ] || { echo "::error::confirmacao invalida"; exit 1; }'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/keycloak
          file: ./apps/keycloak/Dockerfile
          push: true
          tags: |
            ${{ env.REPO_IMAGEM }}:latest
            ${{ env.REPO_IMAGEM }}:${{ github.sha }}
          platforms: linux/amd64

      # O Keycloak das Casas e' um COMPOSE no Dokploy (servico `keycloak`), e a API fala com ele pelo nome do container
      # (`<appName do compose>-<servico>-<n>`, na KEYCLOAK_BASE_URL da API). E' por esse nome que ele e' achado: o
      # Keycloak do operador e' outro e nao casa. Sem exatamente um compose, sem o compose guardado no proprio Dokploy
      # (sourceType raw) ou sem exatamente uma linha `image: quay.io/keycloak/keycloak:...`, para sem mexer em nada.
      - name: Achar o Keycloak das Casas no Dokploy
        id: app
        run: |
          set -euo pipefail
          umask 077
          get() { curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/$1"; }
          kc_url=$(get "application.one?applicationId=$APP_CORE" | jq -r '.env // ""' \
                   | sed -n 's/^[[:space:]]*KEYCLOAK_BASE_URL=["'"'"']\{0,1\}\([^"'"'"']*\).*/\1/p' | head -1)
          host=$(sed -E 's#^[a-z]+://##; s#[:/].*$##' <<< "$kc_url")
          [ -n "$host" ] || { echo "::error::a API nao tem KEYCLOAK_BASE_URL no Dokploy: nada foi trocado"; exit 1; }
          echo "a API fala com o Keycloak em: $host"
          ids=$(get project.all | jq -r '[.. | objects | select(has("composeId")) | .composeId] | unique | .[]')
          achados=()
          for id in $ids; do
            get "compose.one?composeId=$id" > "$RUNNER_TEMP/compose.json"
            an=$(jq -r '.appName // ""' "$RUNNER_TEMP/compose.json")
            if [ -n "$an" ] && [[ "$host" == "$an"-* ]]; then
              echo "compose: $an ($(jq -r '.sourceType // "?"' "$RUNNER_TEMP/compose.json"))"
              achados+=("$id")
              cp "$RUNNER_TEMP/compose.json" "$RUNNER_TEMP/keycloak.json"
            fi
          done
          rm -f "$RUNNER_TEMP/compose.json"
          if [ "${#achados[@]}" -ne 1 ]; then
            echo "::error::esperava 1 compose do container $host no Dokploy, achei ${#achados[@]}: nada foi trocado"
            exit 1
          fi
          tipo=$(jq -r '.sourceType // ""' "$RUNNER_TEMP/keycloak.json")
          if [ "$tipo" != "raw" ]; then
            echo "::error::o compose do Keycloak nao fica no Dokploy (sourceType=$tipo): nada foi trocado"
            exit 1
          fi
          jq -r '.composeFile // ""' "$RUNNER_TEMP/keycloak.json" > "$RUNNER_TEMP/compose-anterior.yml"
          n=$(grep -cE '^[[:space:]]*image:[[:space:]]*["'"'"']?quay\.io/keycloak/keycloak:' "$RUNNER_TEMP/compose-anterior.yml" || true)
          if [ "$n" != "1" ]; then
            echo "::error::esperava 1 linha 'image: quay.io/keycloak/keycloak:...' no compose, achei $n: nada foi trocado"
            exit 1
          fi
          echo "imagem atual: $(grep -E '^[[:space:]]*image:[[:space:]]*["'"'"']?quay\.io/keycloak/keycloak:' "$RUNNER_TEMP/compose-anterior.yml" | sed 's/^[[:space:]]*//')"
          id="${achados[0]}"
          echo "::add-mask::$id"
          jq -n --arg id "$id" --rawfile f "$RUNNER_TEMP/compose-anterior.yml" '{composeId: $id, composeFile: $f}' \
            > "$RUNNER_TEMP/anterior.json"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/keycloak.json"

      # Um COMPOSE puxa a imagem com o login do SERVIDOR (a API puxa com o login guardado no app dela, que nao vale aqui).
      # Na 1a troca (05/10/2026) o pacote era privado e o servidor nao tinha login no GHCR: o Keycloak ficou fora do ar
      # ate' a volta do compose (~14 min). So' segue se a imagem baixa sem login (pacote publico) ou se o Dokploy tem um
      # registro do ghcr.io cadastrado (Settings -> Registry), que loga o servidor.
      - name: Conferir que o servidor consegue baixar a imagem
        run: |
          set -euo pipefail
          t=$(curl -s --max-time 15 "https://ghcr.io/token?scope=repository:${REPO_IMAGEM#ghcr.io/}:pull" | jq -r '.token // empty' || true)
          if [ -n "$t" ] && curl -sf -o /dev/null --max-time 15 -H "Authorization: Bearer $t" \
               -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json' \
               "https://ghcr.io/v2/${REPO_IMAGEM#ghcr.io/}/manifests/latest"; then
            echo "a imagem e' publica: o servidor baixa sem login"
            exit 0
          fi
          n=$(curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/registry.all" \
                | jq '[.[]? | select((.registryUrl // "") | test("ghcr\\.io"))] | length' || echo 0)
          if [ "${n:-0}" -ge 1 ]; then
            echo "o Dokploy tem registro do ghcr.io cadastrado: o servidor baixa com ele"
            exit 0
          fi
          echo "::error::a imagem e' privada e o Dokploy nao tem registro do ghcr.io: o servidor nao conseguiria baixar. Torne o pacote publico ou cadastre o ghcr.io em Settings -> Registry. Nada foi trocado."
          exit 1

      # So' a linha da imagem muda (a indentacao e o resto do compose ficam).
      - name: Trocar a imagem e reimplantar
        env:
          ID: ${{ steps.app.outputs.id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          post() { curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" -H 'Content-Type: application/json' -d @- "$DK/$1" > /dev/null; }
          sed -E "s#^([[:space:]]*image:[[:space:]]*)[\"']?quay\.io/keycloak/keycloak:[^\"'[:space:]]*[\"']?#\1$REPO_IMAGEM:$SHA#" \
            "$RUNNER_TEMP/compose-anterior.yml" > "$RUNNER_TEMP/compose-novo.yml"
          diff "$RUNNER_TEMP/compose-anterior.yml" "$RUNNER_TEMP/compose-novo.yml" | grep -E '^[<>]' | sed 's/^/  /' || true
          [ "$(diff "$RUNNER_TEMP/compose-anterior.yml" "$RUNNER_TEMP/compose-novo.yml" | grep -c '^>')" = "1" ] \
            || { echo "::error::a troca nao mudou exatamente uma linha: nada foi gravado"; exit 1; }
          jq -n --arg id "$ID" --rawfile f "$RUNNER_TEMP/compose-novo.yml" '{composeId: $id, composeFile: $f}' \
            | post compose.update
          jq -n --arg id "$ID" '{composeId: $id}' | post compose.deploy
          echo "deploy disparado: $REPO_IMAGEM:$SHA"

      - name: Conferir o tema no Keycloak (ou voltar atras)
        env:
          ID: ${{ steps.app.outputs.id }}
          KC_SENHA: ${{ secrets.HML_KEYCLOAK_ADMIN_SENHA }}
        run: |
          set -uo pipefail
          tem_tema() {
            local t
            t=$(curl -sf --max-time 15 -d client_id=admin-cli -d username=admin --data-urlencode "password=$KC_SENHA" \
                  -d grant_type=password "$KC/realms/master/protocol/openid-connect/token" | jq -r '.access_token // empty') || return 1
            [ -n "$t" ] || return 1
            curl -sf --max-time 15 -H "Authorization: Bearer $t" "$KC/admin/serverinfo" \
              | jq -e '[.themes.login[]?.name] | index("oplenario")' > /dev/null
          }
          # 12 min para o tema aparecer, mas o Keycloak fora do ar por 4 min seguidos volta o compose na hora: a 1a troca
          # ficou ~14 min fora porque so' a ausencia do tema era medida
          fora=0
          for i in $(seq 1 48); do
            if tem_tema; then echo "tema oplenario carregado no Keycloak (tentativa $i)"; exit 0; fi
            if curl -sf -o /dev/null --max-time 10 "$KC/realms/master"; then fora=0; else fora=$((fora + 1)); fi
            if [ "$fora" -ge 16 ]; then echo "::error::o Keycloak esta' fora do ar ha' 4 min"; break; fi
            sleep 15
          done
          echo "::error::o tema nao apareceu: voltando o compose anterior"
          if ! curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" -H 'Content-Type: application/json' \
                 -d @"$RUNNER_TEMP/anterior.json" "$DK/compose.update" > /dev/null; then
            echo "::error::o Dokploy recusou a volta do compose: no compose do Keycloak, voltar a imagem para quay.io/keycloak/keycloak:26.0.0"
            exit 1
          fi
          if ! jq -n --arg id "$ID" '{composeId: $id}' | curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" \
                 -H 'Content-Type: application/json' -d @- "$DK/compose.deploy" > /dev/null; then
            echo "::error::o compose anterior foi gravado, mas o deploy nao foi disparado: reimplantar no Dokploy"
            exit 1
          fi
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null --max-time 15 "$KC/realms/master"; then
              echo "Keycloak de volta com o compose anterior"
              exit 1
            fi
            sleep 15
          done
          echo "::error::o Keycloak nao voltou em 10 min depois da volta do compose: conferir no Dokploy AGORA"
          exit 1

      - name: Limpar
        if: always()
        run: rm -f "$RUNNER_TEMP"/anterior.json "$RUNNER_TEMP"/keycloak.json "$RUNNER_TEMP"/compose*.yml "$RUNNER_TEMP"/compose.json
