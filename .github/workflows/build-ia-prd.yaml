name: Build/Deploy IA (prd)

# Satelite de IA (apps/ia, ADR-0006) em producao. UMA imagem, DOIS apps no Dokploy (projeto oplenario/production):
#   - ia-api          appName oplenario-iaapi-h9hzqw        (uvicorn :8090 — o core le por OPLENARIO_IA_URL)
#   - ia-trabalhador  appName oplenario-iatrabalhador-izlwf3 (comando oplenario-ia-trabalhador)
# Sem migrate: o satelite cria o schema `ia` ao subir. Credenciais e ambiente dos apps vivem no Dokploy (colados
# por uma pessoa); este workflow so' publica a imagem, dispara o deploy e VERIFICA a fronteira core<->satelite:
# loga como a secretaria e exige que GET /api/busca responda `modo: "ia"` (o core falou com o satelite; com a IA
# fora, a busca cai em `sem-ia`).

on:
  push:
    branches: ["production"]
    paths:
      - "apps/ia/**"
      - ".github/workflows/build-ia-prd.yaml"
  workflow_dispatch:

env:
  APPNAME_API: oplenario-iaapi-h9hzqw
  APPNAME_TRABALHADOR: oplenario-iatrabalhador-izlwf3

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: deploy-ia-prd-${{ github.ref }}
      cancel-in-progress: false
    env:
      DK: https://${{ vars.DOKPLOY_DOMAIN }}/api
      DK_KEY: ${{ secrets.DOKPLOY_KEY }}
      APP_CORE: ${{ secrets.DOKPLOY_APPLICATION_ID_API }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Contexto em apps/ia (pyproject.toml + src). Sem EXTRAS: o ASR self-host (sherpa-onnx) fica fora ate' a
      # A.1 medir a transcricao com o audio real — com ele, a imagem cresce e os modelos entram por volume.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/ia
          file: ./apps/ia/Dockerfile
          push: true
          tags: |
            ghcr.io/gondwanadev/oplenario-ia-prd:latest
          platforms: linux/amd64

      # Acha os dois apps pelo appName (nao pelo nome: pode haver sobra com o mesmo nome) e dispara o deploy.
      - name: Trigger Dokploy Deployment (ia-api + ia-trabalhador)
        run: |
          set -euo pipefail
          get()  { curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/$1"; }
          ENV_ID=$(get "application.one?applicationId=$APP_CORE" | jq -r '.environmentId')
          IDS=$({ get "environment.one?environmentId=$ENV_ID" 2>/dev/null | jq -r '(.applications // [])[] | .applicationId' \
                  || get project.all | jq -r --arg e "$ENV_ID" '.[] | (.environments // [])[] | select(.environmentId == $e) | (.applications // [])[] | .applicationId'; })
          declare -A ID_DE
          for id in $IDS; do
            an=$(get "application.one?applicationId=$id" | jq -r '.appName')
            ID_DE[$an]=$id
            case "$an" in oplenario-ia*) echo "app de IA no ambiente: $an";; esac
          done
          for an in "$APPNAME_API" "$APPNAME_TRABALHADOR"; do
            id=${ID_DE[$an]:-}
            [ -n "$id" ] || { echo "::error::app $an nao encontrado no ambiente"; exit 1; }
            echo "::add-mask::$id"
            curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" -H 'Content-Type: application/json' \
              -d "{\"applicationId\": \"$id\"}" "$DK/application.deploy" > /dev/null
            echo "deploy disparado: $an"
          done

  verificar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Esperar o rollout do satelite
        run: sleep 90
      # So' leitura: loga como a secretaria (seed atual) e consulta a busca. `modo: "ia"` = o core chamou o satelite
      # com o segredo compartilhado e ele respondeu; `sem-ia` = a fronteira nao fechou (URL, segredo ou app fora).
      - name: Conferir a fronteira core <-> satelite (busca)
        env:
          SEC_ID: 60ac7fcd-ab93-4c28-95bb-46761b4a2a52
        run: |
          cat > verificar.mjs <<'JS'
          import { chromium } from 'playwright';
          const B = 'https://oplenario.calvetec.com.br';
          const E = '10000000-0000-0000-0000-000000000001';
          const browser = await chromium.launch();
          try {
            const ctx = await browser.newContext({ locale: 'pt-BR' });
            const p = await ctx.newPage();
            await p.goto(`${B}/api/auth/login?ente=${E}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await p.waitForSelector('#username', { timeout: 25000 });
            await p.fill('#username', process.env.SEC_ID); await p.fill('#password', 'Plenario@2026');
            await Promise.all([ p.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30000 }).catch(()=>{}), p.click('#kc-login') ]);
            await p.waitForTimeout(2500);
            let modo = null, status = null, itens = 0, aviso = '';
            for (let t = 1; t <= 4 && modo !== 'ia'; t++) {
              const r = await ctx.request.get(`${B}/api/busca?q=${encodeURIComponent('sessao ordinaria')}`, { headers: { accept: 'application/json' } });
              status = r.status(); let j = {}; try { j = await r.json(); } catch {}
              modo = j.modo ?? null; itens = (j.resultados || j.itens || []).length; aviso = j.aviso || '';
              console.log(`tentativa ${t}: status=${status} modo=${modo} resultados=${itens}${aviso ? ' aviso="' + aviso + '"' : ''}`);
              if (modo !== 'ia') await p.waitForTimeout(20000);
            }
            if (status !== 200 || modo !== 'ia') { console.log('::error::a busca nao respondeu pela IA — confira OPLENARIO_IA_URL/OPLENARIO_IA_SEGREDO no backend e os logs do ia-api'); process.exitCode = 1; }
            else console.log('OK: o core falou com o satelite (busca modo=ia)');
          } finally { await browser.close(); }
          JS
          node verificar.mjs
