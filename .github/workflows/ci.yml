# CI do backend (F0.6, §22.10/§22.2): roda unit + integracao contra Postgres + MinIO reais.
# Gates que FALHAM o build em violacao: import-lint (§22.10), leak test 3-dim (cross-tenant,
# cross-esfera, lote-nao-efetivado) e os testes de authz/policy.check (§22.5).
name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Cache de deps (~/.m2 + .cpcache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            apps/backend/.cpcache
          key: deps-${{ hashFiles('apps/backend/deps.edn') }}

      - name: Subir Postgres + MinIO (docker compose)
        run: docker compose up -d postgres minio

      - name: Esperar Postgres ficar pronto
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T postgres pg_isready -U oplenario -q && exit 0
            sleep 2
          done
          echo "Postgres nao subiu a tempo"; exit 1

      - name: Esperar MinIO ficar pronto
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO nao subiu a tempo"; exit 1

      - name: Testes (unit + integracao) — import-lint + leak 3-dim + authz sao gates
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/oplenario
          MINIO_ENDPOINT: http://localhost:9000
        run: clojure -M:test --skip :e2e --skip :keycloak
