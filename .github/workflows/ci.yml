# CI do backend (F0.6, §22.10/§22.2): roda unit + integracao contra Postgres + MinIO reais.
# Gates que FALHAM o build em violacao: import-lint (§22.10), leak test 3-dim (cross-tenant,
# cross-esfera, lote-nao-efetivado) e os testes de authz/policy.check (§22.5).
name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      - name: Cache de deps (~/.m2 + .cpcache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2
            apps/backend/.cpcache
          key: deps-${{ hashFiles('apps/backend/deps.edn') }}

      - name: Subir Postgres + Valkey + MinIO + Keycloak + Mailpit (docker compose)
        # `valkey` estava de fora e o teste de integracao do backplane Valkey (que conecta em
        # redis://localhost:6379 direto, independente do backplane :memoria default) morria com
        # `ConnectException: Connection refused` — o unico E do run apos o pull do MinIO ser destravado.
        run: docker compose --profile auth up -d postgres valkey minio keycloak mailpit

      - name: Esperar Postgres ficar pronto
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T postgres pg_isready -U oplenario -q && exit 0
            sleep 2
          done
          echo "Postgres nao subiu a tempo"; exit 1

      - name: Esperar Valkey ficar pronto
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T valkey valkey-cli ping | grep -q PONG && exit 0
            sleep 2
          done
          echo "Valkey nao subiu a tempo"; exit 1

      - name: Esperar MinIO ficar pronto
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO nao subiu a tempo"; exit 1

      - name: Esperar Keycloak ficar pronto
        run: |
          # 1o boot faz Quarkus augmentation — pode levar minutos. Nao assumir pronto pelo "started".
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/realms/master >/dev/null && exit 0
            sleep 4
          done
          echo "Keycloak nao subiu a tempo"; exit 1

      - name: Esperar Mailpit ficar pronto
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/readyz && exit 0
            sleep 2
          done
          echo "Mailpit nao subiu a tempo"; exit 1

      - name: Testes (unit + integracao + keycloak) — import-lint + leak 3-dim + authz sao gates
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/oplenario
          MINIO_ENDPOINT: http://localhost:9000
          KEYCLOAK_BASE_URL: http://localhost:8080
          KEYCLOAK_SMTP_HOST: mailpit
          MAILPIT_URL: http://localhost:8025
        run: clojure -M:test --skip :e2e

  # M3 (docs/20, Onda T0): browser-e2e do Portal do Cidadao via Playwright, contra a stack INTEIRA de pe
  # (app + frontend + infra), em modo dev (sem Keycloak — o portal e publico). E o 1o job de browser do
  # projeto: prova o caminho FE->BFF->backend->DB->render que a suite backend nao alcanca. Specs internos
  # (servidor/vereador) entram por cima deste job ja verde (Onda T1).
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Subir a stack inteira (dev — app + frontend + infra, sem --profile auth)
        # Sem `.env` no CI => a compose cai nos defaults dela (pg 5432, minio 9000, valkey 6379, app 8888,
        # frontend 3000). `up -d --build` honra o depends_on (migrate roda e sai antes do app; frontend
        # sobe depois do app). Nao precisa de keycloak/mailpit: o portal do cidadao e anonimo.
        working-directory: apps/backend
        run: docker compose up -d --build

      - name: Esperar o backend (/saude=200)
        working-directory: apps/backend
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8888/saude && exit 0
            sleep 2
          done
          echo "backend /saude nao respondeu a tempo"; docker compose logs app --tail 80; exit 1

      - name: Semear a Casa do e2e (base + materias + encarregado, com a barreira de projecao)
        # semear.sh default = portas deste dev (5544/9100); no CI a compose usa os defaults dela
        # (5432/9000). Exporta os nomes que semear.sh le p/ casar com a compose (o proprio semear.sh
        # documenta essa necessidade). Roda seeds em containers efemeros (clojure:temurin) via --network host.
        env:
          OPLENARIO_PG_PORT: '5432'
          OPLENARIO_MINIO_PORT: '9000'
        run: ./e2e/semear.sh

      - name: Esperar o frontend (/=200 — next dev compila a rota sob demanda)
        working-directory: apps/backend
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "frontend nao respondeu a tempo"; docker compose logs frontend --tail 80; exit 1

      - name: Instalar o Playwright (Chromium) e rodar os specs
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs da stack (so em falha)
        if: failure()
        working-directory: apps/backend
        run: docker compose logs app frontend --tail 120

  # T1 (docs/20): a Trilha 3 (`e2e/t3/`) — 8 specs de browser AUTENTICADAS (escritas internas por
  # persona, via dev-token `?token=`). Ja' existia no repo, nunca ligada ao CI. Exige a semente CHEIA
  # (`demo/semear-tudo.sh`, nao o seed_demo do harness — as fixtures/specs cravam ids fixos da demo) +
  # `t3/preparar.sh` (documento_modelo + notificacoes + parecer-alvo, o que nao tem rota HTTP). Stack
  # EFEMERA: a mutacao da Casa que a MAPA.json alerta nao colide com nada aqui (DB descartado no fim).
  t3-e2e:
    runs-on: ubuntu-latest
    # INFORMATIVO ate' a Trilha 3 ser fresh-seed-portavel (fixtures.sql crava ids congelados — ver
    # docs/16, Onda T1). Nao bloqueia o run: o gate real e' `test` + `browser-e2e` (ambos verdes/estaveis).
    # Remover o continue-on-error quando os 8 specs passarem no seed fresco do CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Subir a stack inteira (dev — dev-token; sem --profile auth)
        working-directory: apps/backend
        run: docker compose up -d --build

      - name: Esperar o backend (/saude=200)
        working-directory: apps/backend
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8888/saude && exit 0
            sleep 2
          done
          echo "backend /saude nao respondeu a tempo"; docker compose logs app --tail 80; exit 1

      - name: Semear a Casa CHEIA (demo/semear-tudo.sh — escreve e2e/.artifacts/demo-ids.edn)
        # A Trilha 3 crava ids FIXOS da demo (ente ...0001, identidades, proposicoes, parecer-modelo);
        # so' a semente narrativa completa os produz. Portas default da compose no CI (5432/9000/8888).
        env:
          OPLENARIO_PG_PORT: '5432'
          OPLENARIO_MINIO_PORT: '9000'
        run: ./demo/semear-tudo.sh

      - name: Esperar o frontend (/=200)
        working-directory: apps/backend
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "frontend nao respondeu a tempo"; docker compose logs frontend --tail 80; exit 1

      - name: Preparar a Trilha 3 (fixtures.sql + preparar.mjs — precondicoes sem rota HTTP)
        run: ./e2e/t3/preparar.sh

      - name: Rodar os 8 specs da Trilha 3 (E2E_INCLUDE_T3=1)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_INCLUDE_T3: '1'
        run: |
          sudo rm -rf node_modules   # defensivo: preparar.sh pode ter deixado um mountpoint root-owned
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test t3/

      - name: Logs da stack (so em falha)
        if: failure()
        working-directory: apps/backend
        run: docker compose logs app frontend --tail 160

  # M3 (docs/20, Onda T1) — GATE de regressao da AUTORIZACAO DE LEITURA por papel (spec E9). Diferente do
  # t3-e2e (informativo: os specs E1-E8 cravam ids congelados via fixtures.sql/preparar.mjs), esta e'
  # PORTAVEL — a E9 constroi os dev-tokens a partir do demo-ids.edn que `demo/semear-tudo.sh` escreve —
  # entao BLOQUEIA. Guarda o conserto feat(authz): vereador/presidente LEEM proposicoes/tramitacao/paineis
  # (era 403 pelo gate grosso so'-secretario). NAO roda preparar.sh: a E9 nao depende das fixtures dos E1-E8.
  t3-autz-leitura-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Subir a stack inteira (dev — dev-token; sem --profile auth)
        working-directory: apps/backend
        run: docker compose up -d --build

      - name: Esperar o backend (/saude=200)
        working-directory: apps/backend
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8888/saude && exit 0
            sleep 2
          done
          echo "backend /saude nao respondeu a tempo"; docker compose logs app --tail 80; exit 1

      - name: Semear a Casa CHEIA (demo/semear-tudo.sh — escreve e2e/.artifacts/demo-ids.edn)
        env:
          OPLENARIO_PG_PORT: '5432'
          OPLENARIO_MINIO_PORT: '9000'
        run: ./demo/semear-tudo.sh

      - name: Esperar o frontend (/=200)
        working-directory: apps/backend
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "frontend nao respondeu a tempo"; docker compose logs frontend --tail 80; exit 1

      - name: Rodar a spec de autorizacao de leitura (E9)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_BACKEND_URL: http://localhost:8888
          E2E_INCLUDE_T3: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test t3/E9-autorizacao-leitura.spec.ts

      - name: Logs da stack (so em falha)
        if: failure()
        working-directory: apps/backend
        run: docker compose logs app frontend --tail 160

  # GATE DO FRONTEND — o buraco que deixou 32 testes apodrecerem sem ninguem ver.
  #
  # Ate' aqui o CI tocava o frontend so' de fora: `browser-e2e`, `t3-e2e` e `t3-autz-leitura-e2e` SOBEM a
  # stack e dirigem o browser, mas nenhum job rodava `vitest`, `eslint` ou `tsc` sobre `apps/frontend`.
  # Consequencia medida em 21/09/2026: 32 testes unitarios quebrados em 3 arquivos, verdes por ninguem os
  # rodar. Todos da MESMA forma — a tela mudou e o teste ficou — e um unico commit (70fdd43) deixou DOIS
  # para tras, alem de introduzir um erro de lint. Um e2e de browser nao pega nada disso: ele exercita o
  # caminho feliz de algumas telas, nao as 176 suites de unidade.
  #
  # Este job e' barato de proposito: nao sobe docker, nao semeia banco, nao instala browser. Node + npm ci.
  # Isso importa com a cota do Actions apertada — e' o job que roda em TODO push sem pesar.
  # Satélite de IA (ADR-0006, Track IA base comum): lint, tipos estritos, testes e o conjunto de avaliação — tudo
  # contra o fornecedor FAKE (custo zero, determinístico). Avaliar contra fornecedor real é comando manual
  # (`oplenario-ia-avaliar --vendor anthropic`), obrigatório antes de trocar modelo (§22.11.8), porque gasta dinheiro.
  ia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ia
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/ia/pyproject.toml

      - name: Instalar o satélite + ferramentas de dev
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Tipos (mypy --strict)
        run: mypy

      - name: Testes (pytest)
        run: pytest

      - name: Conjunto de avaliação da base (fornecedor fake)
        run: oplenario-ia-avaliar avaliacoes

  # Faixa A / A.2 (ADR-0007) — o utilitario de captacao do PC da transmissao. So' biblioteca padrao em runtime;
  # roda em Python 3.10 (o piso declarado) para nao usar sem querer algo que o PC da Camara nao tenha.
  captacao:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/captacao
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: apps/captacao/pyproject.toml

      - name: Instalar o utilitario + ferramentas de dev
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Tipos (mypy --strict)
        run: mypy

      - name: Testes (pytest)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Instalar deps (lockfile exato)
        run: npm ci

      # O gate que faltava. 1552 testes / 176 arquivos verdes em 21/09/2026.
      - name: Testes de unidade (vitest)
        run: npm test

      # `react-hooks/set-state-in-effect` e o resto do eslint-config-next. Verde em 21/09/2026 depois de
      # dois consertos reais (use-calendario, use-detalhe-votacao) — nao entra com divida pendurada.
      - name: Lint (eslint)
        run: npx eslint .

      # Compila de verdade, com as envs que o next.config.ts EXIGE em producao (APP_ORIGIN,
      # KEYCLOAK_INTERNAL_URL, KEYCLOAK_PUBLIC_URL — os guards fail-fast anti-SSRF/open-redirect). Valores
      # locais de fachada: aqui so' se quer saber se a build passa, nao se fala com ninguem. Sem este passo
      # uma quebra de build so' apareceria no deploy (build-web-prd, que so' roda em `production`).
      - name: Build de producao (next build)
        env:
          APP_ORIGIN: http://localhost:3000
          BACKEND_URL: http://localhost:8888
          KEYCLOAK_INTERNAL_URL: http://localhost:8080
          KEYCLOAK_PUBLIC_URL: http://localhost:8080
        run: npx next build

      # BLOQUEANTE desde 21/09/2026. Nasceu informativo (39 erros, todos em `*.test.ts(x)`) e a divida foi
      # zerada na mesma sessao — nao ha continue-on-error aqui de proposito. Os testes NAO entram no grafo
      # que o `next build` typechecka, entao sem este passo a checagem de tipos dos fixtures fica sem dono,
      # que foi exatamente como os 39 se acumularam sem ninguem ver.
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
