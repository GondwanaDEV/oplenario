name: Configurar satelite de IA no Dokploy (prd)

# DIAGNOSTICO (so' leitura) da fronteira core <-> satelite no Dokploy. Nada e' gravado; nenhum valor de segredo
# e' impresso — so' nomes de variaveis, status, imagem/comando, o host de OPLENARIO_IA_URL e se o segredo e' IGUAL
# nos dois lados (sim/nao).

on:
  push:
    branches: ["production"]
    paths:
      - ".github/workflows/configurar-ia-prd.yaml"

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DK: https://${{ vars.DOKPLOY_DOMAIN }}/api
      DK_KEY: ${{ secrets.DOKPLOY_KEY }}
      APP_CORE: ${{ secrets.DOKPLOY_APPLICATION_ID_API }}
      APPNAME_API: oplenario-iaapi-h9hzqw
      APPNAME_TRABALHADOR: oplenario-iatrabalhador-izlwf3
    steps:
      - name: Diagnostico (so' leitura)
        run: |
          set -euo pipefail
          get() { curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/$1"; }
          T=$(mktemp -d)
          valor() { jq -r '.env // ""' "$1" | grep -E "^$2=" | head -1 | cut -d= -f2- || true; }
          resumo() {  # arquivo rotulo
            jq -r --arg r "$2" '
              "== \($r): appName=\(.appName) status=\(.applicationStatus) imagem=\(.dockerImage // "-") comando=\(.command // "-") registro-login? \((.username // "") != "")",
              "   variaveis: \((.env // "") | split("\n") | map(select(test("^[A-Za-z_][A-Za-z0-9_]*=")) | split("=")[0]) | join(","))",
              "   ultimos deploys: \((.deployments // []) | sort_by(.createdAt) | reverse | .[0:3] | map("\(.createdAt) \(.status) \(.title // "")\(if .errorMessage then " ERRO=" + .errorMessage else "" end)") | join(" | "))"' "$1"
          }

          get "application.one?applicationId=$APP_CORE" > "$T/core.json"
          ENV_ID=$(jq -r '.environmentId' "$T/core.json")
          IDS=$({ get "environment.one?environmentId=$ENV_ID" 2>/dev/null | jq -r '(.applications // [])[] | .applicationId' \
                  || get project.all | jq -r --arg e "$ENV_ID" '.[] | (.environments // [])[] | select(.environmentId == $e) | (.applications // [])[] | .applicationId'; })
          for id in $IDS; do
            get "application.one?applicationId=$id" > "$T/a.json"
            an=$(jq -r '.appName' "$T/a.json")
            case "$an" in "$APPNAME_API") cp "$T/a.json" "$T/api.json";; "$APPNAME_TRABALHADOR") cp "$T/a.json" "$T/trab.json";; esac
            case "$an" in oplenario-ia*) echo "app de IA no ambiente: $an ($(jq -r '.name' "$T/a.json"))";; esac
          done

          resumo "$T/core.json" backend
          [ -f "$T/api.json" ]  && resumo "$T/api.json" ia-api          || echo "::error::ia-api ($APPNAME_API) nao encontrado"
          [ -f "$T/trab.json" ] && resumo "$T/trab.json" ia-trabalhador || echo "::error::ia-trabalhador ($APPNAME_TRABALHADOR) nao encontrado"

          echo "== fronteira"
          echo "backend OPLENARIO_IA_URL = $(valor "$T/core.json" OPLENARIO_IA_URL)"
          for f in api trab; do
            [ -f "$T/$f.json" ] || continue
            echo "$f OPLENARIO_CORE_URL = $(valor "$T/$f.json" OPLENARIO_CORE_URL)"
            S1=$(valor "$T/core.json" OPLENARIO_IA_SEGREDO); S2=$(valor "$T/$f.json" OPLENARIO_IA_SEGREDO)
            echo "$f segredo igual ao do backend? $([ -n "$S1" ] && [ "$S1" = "$S2" ] && echo sim || echo NAO) (backend tem? $([ -n "$S1" ] && echo sim || echo nao); $f tem? $([ -n "$S2" ] && echo sim || echo nao))"
            D=$(valor "$T/$f.json" OPLENARIO_IA_DATABASE_URL)
            echo "$f banco: $(printf '%s' "$D" | sed -E 's#^(postgresql://)[^@]*@#\1<credenciais>@#')"
          done
          rm -rf "$T"
