name: Configurar satelite de IA no Dokploy (prd)

# LIMPEZA: remove os dois apps de IA duplicados criados por uma versao anterior deste workflow (vazios, sem
# credencial, nunca deployados). Trava: so' apaga os appNames EXATOS abaixo e se recusa a tocar nos apps em uso
# (oplenario-iaapi-h9hzqw / oplenario-iatrabalhador-izlwf3). Nenhum valor de segredo e' lido ou impresso.

on:
  push:
    branches: ["production"]
    paths:
      - ".github/workflows/configurar-ia-prd.yaml"

jobs:
  limpar:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DK: https://${{ vars.DOKPLOY_DOMAIN }}/api
      DK_KEY: ${{ secrets.DOKPLOY_KEY }}
      APP_CORE: ${{ secrets.DOKPLOY_APPLICATION_ID_API }}
      APAGAR: "oplenario-ia-api-lxzklp oplenario-ia-trabalhador-9blnqb"
      MANTER: "oplenario-iaapi-h9hzqw oplenario-iatrabalhador-izlwf3 oplenario-backend-zvr55n"
    steps:
      - name: Apagar os apps duplicados (so' os dois appNames exatos)
        run: |
          set -euo pipefail
          get() { curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' "$DK/$1"; }
          ENV_ID=$(get "application.one?applicationId=$APP_CORE" | jq -r '.environmentId')
          IDS=$({ get "environment.one?environmentId=$ENV_ID" 2>/dev/null | jq -r '(.applications // [])[] | .applicationId' \
                  || get project.all | jq -r --arg e "$ENV_ID" '.[] | (.environments // [])[] | select(.environmentId == $e) | (.applications // [])[] | .applicationId'; })
          apagados=0
          for id in $IDS; do
            info=$(get "application.one?applicationId=$id" | jq -c '{appName, name, deploys: ((.deployments // []) | length)}')
            an=$(jq -r '.appName' <<<"$info")
            for m in $MANTER; do [ "$an" = "$m" ] && continue 2; done
            for a in $APAGAR; do
              if [ "$an" = "$a" ]; then
                echo "::add-mask::$id"
                echo "apagando: $info"
                curl --fail-with-body -sS -X POST -H "x-api-key: $DK_KEY" -H 'Content-Type: application/json' \
                  -d "{\"applicationId\": \"$id\"}" "$DK/application.delete" > /dev/null
                apagados=$((apagados+1))
              fi
            done
          done
          echo "apagados: $apagados"
          echo "== apps de IA que restam no ambiente"
          for id in $({ get "environment.one?environmentId=$ENV_ID" 2>/dev/null | jq -r '(.applications // [])[] | .applicationId' \
                  || get project.all | jq -r --arg e "$ENV_ID" '.[] | (.environments // [])[] | select(.environmentId == $e) | (.applications // [])[] | .applicationId'; }); do
            get "application.one?applicationId=$id" | jq -r 'select(.appName | startswith("oplenario-ia")) | "\(.appName) (\(.name)) comando=\(.command // "-")"'
          done
