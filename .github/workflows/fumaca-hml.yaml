name: Fumaca das telas novas (homolog)

# Smoke test SÓ-LEITURA das 3 telas novas deployadas (tramitar / moderacao / assinatura de parecer).
# Loga de verdade via Keycloak, navega e confirma que a UI RENDERIZA (nao 404, nao erro, elementos novos
# presentes). Nao faz nenhuma escrita. Cada checagem e independente (flag [OK]/[ERRO]).
# A unica requisicao de escrita (caso 14, envio de arquivo) vai a uma prestacao de contas que nao existe: o
# parser le o arquivo e a rota responde 404 sem gravar nada (so' a trilha de auditoria registra a tentativa).
# O caso 15 (complemento da resposta) segue a mesma regra: so' envia pedidos que a rota tem de recusar (404, 400, 409, 403).

on:
  workflow_dispatch:
    inputs:
      secretaria:
        # Username (= identidade-id) da secretaria no seed ATUAL de producao — muda a cada reset do banco.
        # O valor novo sai no passo "Ids da demo" do semear-hml (credenciais.edn, persona :secretaria).
        description: 'identidade-id da secretaria (ver "Ids da demo" do ultimo semear)'
        required: true
        default: '60ac7fcd-ab93-4c28-95bb-46761b4a2a52'
        type: string
      vereadora:
        # Idem para a persona :vereador (credenciais.edn do ultimo semear).
        description: 'identidade-id da vereadora (ver "Ids da demo" do ultimo semear)'
        required: true
        default: '2a5943c3-9df8-4016-8f83-a61bcccc5294'
        type: string

jobs:
  fumaca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm i -D playwright@1.47.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium
      - name: Escrever o teste
        run: |
          cat > fumaca.mjs <<'JS'
          import { chromium } from 'playwright';
          const B = 'https://oplenario.calvetec.com.br';
          const E = '10000000-0000-0000-0000-000000000001';
          const SENHA = 'Plenario@2026';
          // UUIDs das personas SAO regenerados a cada reset+reseed (casa.clj cria identidades com
          // (random-uuid); so' `ente-id` e' constante fixa). Estes vieram do cartao de credenciais do
          // ultimo semear-hml com resetar=sim (run #8, 2026-09-21). Se rodar outro reset, reveja o
          // passo "Ids da demo" do semear-hml e atualize aqui.
          // Username da secretaria no seed atual (input `secretaria` do workflow_dispatch).
          const SEC = process.env.SEC_ID;
          const VER = process.env.VER_ID; // input `vereadora`
          const R = [];
          const rec = (tela, flag, nota) => { R.push({ tela, flag, nota }); console.log(`  [${flag}] ${tela} — ${nota}`); };

          async function login(ctx, user) {
            const p = await ctx.newPage();
            await p.goto(`${B}/api/auth/login?ente=${E}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await p.waitForSelector('#username', { timeout: 25000 });
            await p.fill('#username', user); await p.fill('#password', SENHA);
            await Promise.all([ p.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 30000 }).catch(()=>{}), p.click('#kc-login') ]);
            await p.waitForTimeout(2500);
            const ok = p.url().startsWith(B) && !new URL(p.url()).pathname.startsWith('/api/auth');
            await p.close(); return ok;
          }
          async function api(ctx, path) {
            const r = await ctx.request.fetch(B + path, { headers: { accept: 'application/json' }, timeout: 25000 });
            let j = null; try { j = await r.json(); } catch {}
            return { status: r.status(), body: j };
          }

          const browser = await chromium.launch();
          try {
            const cSec = await browser.newContext({ locale: 'pt-BR' });
            const cVer = await browser.newContext({ locale: 'pt-BR' });
            const okSec = await login(cSec, SEC), okVer = await login(cVer, VER);
            console.log(`login secretaria=${okSec} vereadora=${okVer}`);

            // 1) MODERACAO — rota nova + entrada na nav
            try {
              const p = await cSec.newPage();
              await p.goto(`${B}/moderacao`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(2500);
              const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              const temTela = /Modera[cç][aã]o de coment[aá]rios/i.test(txt);
              const temErro = /Acesso restrito|Application error|Internal Server|erro inesperado|N[aã]o foi poss[ií]vel/i.test(txt);
              const temNav = /Modera[cç][aã]o/.test(await p.evaluate(() => document.querySelector('.nav-interna')?.innerText || ''));
              await p.close();
              if (temTela && !temErro) rec('/moderacao', 'OK', `renderizou o titulo + fila; entrada na nav=${temNav}`);
              else rec('/moderacao', 'ERRO', `titulo=${temTela} erro=${temErro} :: ${txt.slice(0,120)}`);
            } catch (e) { rec('/moderacao', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 2) TRAMITAR — painel "Atos disponiveis" na aba Tramitacao da ficha
            try {
              const lst = await api(cSec, '/api/legislativo/proposicoes');
              const props = Array.isArray(lst.body) ? lst.body : (lst.body?.proposicoes || lst.body?.itens || []);
              const pid = props[0]?.id;
              if (!pid) { rec('ficha /tramitacao', 'ERRO', 'sem proposicao para abrir a ficha'); }
              else {
                const p = await cSec.newPage();
                await p.goto(`${B}/ficha-materia/${pid}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await p.waitForTimeout(2500);
                // clicar na aba Tramitacao
                const aba = p.getByRole('tab', { name: /Tramita/i });
                if (await aba.count()) await aba.first().click({ timeout: 10000 }).catch(()=>{});
                await p.waitForTimeout(1500);
                const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
                const temPainel = /Atos dispon[ií]veis|estado atual:/i.test(txt);
                const temErro = /Application error|Internal Server|erro inesperado|N[aã]o foi poss[ií]vel carregar esta ficha/i.test(txt);
                await p.close();
                if (temPainel && !temErro) rec('ficha /tramitacao', 'OK', 'painel "Atos disponiveis" renderizou na aba Tramitacao');
                else rec('ficha /tramitacao', 'ERRO', `painel=${temPainel} erro=${temErro} :: ${txt.slice(0,120)}`);
              }
            } catch (e) { rec('ficha /tramitacao', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 3) ASSINATURA DE PARECER — a tela renderiza (voto ja setado -> CTA; sem voto -> seletor)
            try {
              // resolver um parecer da vereadora via ficha das materias
              let parecerId = null;
              const lst = await api(cVer, '/api/legislativo/proposicoes');
              const props = Array.isArray(lst.body) ? lst.body : (lst.body?.proposicoes || lst.body?.itens || []);
              for (const pr of props.slice(0, 25)) {
                const fx = await api(cVer, `/api/legislativo/proposicoes/${pr.id}/ficha`);
                const pcs = fx.body?.pareceres || fx.body?.proposicao?.pareceres || [];
                const alvo = pcs.find(x => /aguardando/i.test(x.estado || ''));
                if (alvo) { parecerId = alvo.id; break; }
              }
              if (!parecerId) { rec('/parecer/:id/assinar', 'ERRO', 'nenhum parecer aguardando_assinatura encontrado'); }
              else {
                const p = await cVer.newPage();
                await p.goto(`${B}/parecer/${parecerId}/assinar`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await p.waitForTimeout(2500);
                const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
                const cta = await p.getByRole('button', { name: /Revisar e assinar/i }).count();
                const seletor = await p.getByRole('radiogroup', { name: /Conclus[aã]o do relator/i }).count();
                const carregou = /Assinar parecer/i.test(txt) && !/N[aã]o foi poss[ií]vel carregar/i.test(txt);
                await p.close();
                if (carregou && (cta > 0 || seletor > 0)) rec('/parecer/:id/assinar', 'OK', `renderizou (CTA=${cta} seletor-de-voto=${seletor})`);
                else if (carregou) rec('/parecer/:id/assinar', 'OK', `pagina carregou; sem CTA/seletor (estado: ${txt.slice(0,90)})`);
                else rec('/parecer/:id/assinar', 'ERRO', `nao carregou (posse?) :: ${txt.slice(0,120)}`);
              }
            } catch (e) { rec('/parecer/:id/assinar', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 4) MINHA ATUACAO — a aba Perfil do app da vereadora (os numeros do perfil publico dela)
            try {
              const p = await cVer.newPage();
              await p.goto(`${B}/vereador/atuacao`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              const nums = await p.getByRole('list', { name: 'Números do mandato' }).count();
              await p.close();
              const semPercentual = !/\d\s*%/.test(txt);
              if (nums === 1 && semPercentual) rec('/vereador/atuacao', 'OK', `renderizou: ${txt.slice(txt.indexOf('Minha atua'), txt.indexOf('Minha atua') + 140)}`);
              else rec('/vereador/atuacao', 'ERRO', `numeros=${nums} sem-percentual=${semPercentual} :: ${txt.slice(0,140)}`);
            } catch (e) { rec('/vereador/atuacao', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 5) LIVRO DE ATAS — interno (secretaria) e portal (anonimo, contexto sem cookie)
            try {
              const r = await api(cSec, '/api/atas');
              const n = Array.isArray(r.body?.atas) ? r.body.atas.length : null;
              const p = await cSec.newPage();
              await p.goto(`${B}/atas`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await p.close();
              // a demo tem atas publicadas (a da ordinaria e a da audiencia de metas fiscais): o livro nao pode abrir vazio, e a
              // folha da mais recente mostra o texto (as duas dizem "reuniu-se ...")
              const ok = r.status === 200 && n >= 1 && /Atas das sess/.test(txt) && /reuniu-se/.test(txt)
                && !/Aprovada/.test(txt);
              rec('/atas', ok ? 'OK' : 'ERRO', `status=${r.status} atas=${n ?? '-'} :: ${txt.slice(txt.indexOf('Atas das'), txt.indexOf('Atas das') + 120)}`);
            } catch (e) { rec('/atas', 'ERRO', String(e).split('\n')[0].slice(0,140)); }
            try {
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const r = await api(anon, `/api/portal/casa/${E}/atas`);
              const n = Array.isArray(r.body?.atas) ? r.body.atas.length : null;
              const p = await anon.newPage();
              await p.goto(`${B}/portal/casa/${E}/atas`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await anon.close();
              const ok = r.status === 200 && n >= 1 && /Atas das sess/.test(txt) && /reuniu-se/.test(txt);
              rec('/portal/casa/:ente/atas', ok ? 'OK' : 'ERRO', `anonimo status=${r.status} atas-publicas=${n ?? '-'}`);
            } catch (e) { rec('/portal/casa/:ente/atas', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 6) DADOS ABERTOS — catalogo + um CSV, anonimo
            try {
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const r = await api(anon, `/api/portal/casa/${E}/dados-abertos`);
              const ds = Array.isArray(r.body?.datasets) ? r.body.datasets : [];
              const csv = await anon.request.get(`${B}/api/portal/casa/${E}/dados-abertos/proposicoes.csv`);
              const corpo = await csv.text();
              await anon.close();
              const ok = r.status === 200 && ds.length === 3 && csv.status() === 200
                && /text\/csv/.test(csv.headers()['content-type'] || '') && corpo.includes('proposicao_id,tipo,numero');
              rec('/portal/casa/:ente/dados-abertos', ok ? 'OK' : 'ERRO',
                  `status=${r.status} datasets=${ds.map(d => d.chave + ':' + d.linhas).join(' ')} csv=${csv.status()} linhas-csv=${corpo.split('\r\n').length - 2}`);
            } catch (e) { rec('/portal/casa/:ente/dados-abertos', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 7) TRILHA DE AUDITORIA (ADR-0017) — a secretaria ve a propria trilha (o login desta fumaca ja' entrou nela),
            //    a integridade e' so' do auditor (403), e o portal publica os selos do dia (anonimo)
            try {
              const r = await api(cSec, '/api/auditoria');
              const integ = await api(cSec, '/api/auditoria/integridade');
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const pub = await api(anon, `/api/portal/casa/${E}/integridade`);
              await anon.close();
              const p = await cSec.newPage();
              await p.goto(`${B}/auditoria`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await p.close();
              const ok = r.status === 200 && r.body?.escopo === 'propria' && r.body?.total >= 1
                && integ.status === 403 && pub.status === 200 && Array.isArray(pub.body?.['selos-do-dia'])
                && /Trilha de auditoria/.test(txt) && /sua própria trilha/.test(txt);
              rec('/auditoria', ok ? 'OK' : 'ERRO',
                  `status=${r.status} escopo=${r.body?.escopo} total=${r.body?.total} integridade=${integ.status} selos-publicos=${pub.status}:${pub.body?.['selos-do-dia']?.length ?? '-'}`);
            } catch (e) { rec('/auditoria', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 8) PARECER JURIDICO (ADR-0019) — a secretaria le a fila (pendentes + o atendido da semente) e a tela abre; o vereador
            //    NAO le a fila (403); a lista de comissoes vem; o parecer assinado da materia aprovada aparece no portal (anonimo)
            try {
              const fila = await api(cSec, '/api/legislativo/pedidos-parecer-juridico?estado=todos');
              const pedidos = Array.isArray(fila.body?.pedidos) ? fila.body.pedidos : [];
              const atendido = pedidos.find(x => x.estado === 'atendido' && x.proposicao);
              const ver = await api(cVer, '/api/legislativo/pedidos-parecer-juridico');
              const com = await api(cSec, '/api/legislativo/comissoes');
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const pub = atendido ? await api(anon, `/api/portal/casa/${E}/materias/${atendido.proposicao.id}/pareceres-juridicos`) : { status: 0, body: null };
              await anon.close();
              const p = await cSec.newPage();
              await p.goto(`${B}/juridico`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const txt = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await p.close();
              const ok = fila.status === 200 && pedidos.length >= 3 && !!atendido && ver.status === 403
                && com.status === 200 && (com.body?.comissoes?.length ?? 0) >= 3
                && pub.status === 200 && pub.body?.pareceres?.length === 1 && pub.body.pareceres[0].conclusao === 'favoravel'
                && /Parecer jurídico/.test(txt);
              rec('/juridico', ok ? 'OK' : 'ERRO',
                  `pedidos=${pedidos.length} atendido=${!!atendido} vereador-na-fila=${ver.status} comissoes=${com.body?.comissoes?.length ?? '-'} portal=${pub.status}:${pub.body?.pareceres?.length ?? '-'}`);
            } catch (e) { rec('/juridico', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // ADR-0019 fatia 3: a pauta oficial publicada (a demo publica a v1 da sessao agendada) — portal anonimo +
            // a tela de publicar da secretaria
            try {
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const lst = await api(anon, `/api/portal/casa/${E}/pautas`);
              const sess = Array.isArray(lst.body?.sessoes) ? lst.body.sessoes : [];
              const pub = sess.find(x => x['pauta-oficial']);
              const det = pub ? await api(anon, `/api/portal/casa/${E}/pautas/${pub['sessao-id']}`) : { status: 0, body: null };
              const pg = await anon.newPage();
              await pg.goto(`${B}/portal/casa/${E}/pautas`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await pg.waitForTimeout(3000);
              const tp = (await pg.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await anon.close();
              const pubSec = pub ? await api(cSec, `/api/sessoes/${pub['sessao-id']}/pauta/publicacao`) : { status: 0, body: null };
              const ok = lst.status === 200 && !!pub && det.status === 200 && (det.body?.vigente?.itens?.length ?? 0) >= 1
                && pubSec.status === 200 && (pubSec.body?.versoes?.length ?? 0) >= 1 && /Pauta oficial/.test(tp);
              rec('/portal/.../pautas', ok ? 'OK' : 'ERRO',
                  `sessoes=${sess.length} publicada=${!!pub} vigente-itens=${det.body?.vigente?.itens?.length ?? '-'} publicacao-sec=${pubSec.status}:${pubSec.body?.versoes?.length ?? '-'}`);
            } catch (e) { rec('/portal/.../pautas', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 9) COMUNICADOS (ADR-0020) — a demo semeia 3: a secretaria enviou 2 (um pedindo ciencia, a Mesa + a vereadora +
            //    o Juridico), o painel de leitura dela responde, a contagem do topo nao marca; a vereadora tem o comunicado
            //    da sessao extraordinaria na caixa e NAO ve os enviados da Casa (403); as telas /caixa e /comunicados/enviados
            try {
              const env = await api(cSec, '/api/meu/comunicados/enviados');
              const itens = Array.isArray(env.body?.itens) ? env.body.itens : [];
              const comCiencia = itens.find(x => x['exige-ciencia'] && /^COM-\d{4}-\d{6}$/.test(x.protocolo || ''));
              const leitura = comCiencia ? await api(cSec, `/api/comunicados/${comCiencia.id}/leitura`) : { status: 0, body: null };
              const cont = await api(cSec, '/api/meu/comunicados/contagem');
              const setores = await api(cSec, '/api/meu/comunicados/destinos');
              const cxVer = await api(cVer, '/api/meu/comunicados');
              const daCasaVer = await api(cVer, '/api/meu/comunicados/enviados?escopo=casa');
              const p = await cSec.newPage();
              await p.goto(`${B}/caixa`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const tc = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await p.goto(`${B}/comunicados/enviados`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const te = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await p.close();
              const naCaixaVer = (cxVer.body?.itens || []).some(x => /Sess[aã]o extraordin/.test(x.assunto || ''));
              const ok = env.status === 200 && itens.length >= 2 && !!comCiencia
                && leitura.status === 200 && (leitura.body?.linhas?.length ?? 0) >= 2
                && cont.status === 200 && typeof cont.body?.['nao-lidos'] === 'number'
                && setores.status === 200 && (setores.body?.setores?.length ?? 0) >= 3 && setores.body?.['pode-enviar-a-grupos'] === true
                && cxVer.status === 200 && naCaixaVer && daCasaVer.status === 403
                && /Caixa/.test(tc) && /Escrever comunicado/.test(tc) && /Enviados/.test(te) && /COM-\d{4}-\d{6}/.test(te);
              rec('/caixa + comunicados', ok ? 'OK' : 'ERRO',
                  `enviados=${env.status}:${itens.length} com-ciencia=${comCiencia?.protocolo ?? '-'} leitura=${leitura.status}:${leitura.body?.linhas?.length ?? '-'} contagem=${cont.status} setores=${setores.body?.setores?.length ?? '-'} caixa-vereadora=${cxVer.status}:${naCaixaVer} enviados-casa-vereadora=${daCasaVer.status}`);
            } catch (e) { rec('/caixa + comunicados', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 10) AUDIENCIA PUBLICA (ADR-0021 parte A) — a demo semeia uma tematica agendada (2 inscritos) e a de metas fiscais
            //     2026-Q1 encerrada com ata (2 cidadaos falaram). O portal lista as duas; a pagina publica oferece "Quero
            //     falar"; a Mesa ve a fila em /sessoes/:id/audiencia.
            try {
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const lst = await api(anon, `/api/portal/casa/${E}/audiencias`);
              const prox = Array.isArray(lst.body?.proximas) ? lst.body.proximas : [];
              const real = Array.isArray(lst.body?.realizadas) ? lst.body.realizadas : [];
              const metas = real.find(x => x.finalidade === 'metas_fiscais');
              const detM = metas ? await api(anon, `/api/portal/casa/${E}/audiencias/${metas['sessao-id']}`) : { status: 0, body: null };
              const alvo = prox[0];
              const pg = await anon.newPage();
              let tp = '';
              if (alvo) {
                await pg.goto(`${B}/portal/casa/${E}/audiencias/${alvo['sessao-id']}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await pg.waitForTimeout(3000);
                tp = (await pg.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              }
              await anon.close();
              const mesa = alvo ? await api(cSec, `/api/sessoes/${alvo['sessao-id']}/audiencia`) : { status: 0, body: null };
              let tm = '';
              if (alvo) {
                const p = await cSec.newPage();
                await p.goto(`${B}/sessoes/${alvo['sessao-id']}/audiencia`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await p.waitForTimeout(3000);
                tm = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
                await p.close();
              }
              const ok = lst.status === 200 && prox.length >= 1 && !!metas
                && detM.status === 200 && detM.body?.['ata-publicada'] === true && (detM.body?.falaram?.length ?? 0) >= 2
                && /Quero falar/i.test(tp) && mesa.status === 200 && (mesa.body?.inscricoes?.length ?? 0) >= 2
                && /Inscri/i.test(tm) && !/Application error|Internal Server/i.test(tp + tm);
              rec('audiencias publicas', ok ? 'OK' : 'ERRO',
                  `portal=${lst.status} proximas=${prox.length} realizadas=${real.length} metas-ata=${detM.body?.['ata-publicada'] ?? '-'} falaram=${detM.body?.falaram?.length ?? '-'} quero-falar=${/Quero falar/i.test(tp)} mesa=${mesa.status}:${mesa.body?.inscricoes?.length ?? '-'}`);
            } catch (e) { rec('audiencias publicas', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 11) JULGAMENTO DAS CONTAS (ADR-0021 parte B) — a demo semeia o Prefeito 2024 pronto para a pauta, o 2023 julgado
            //     (parecer mantido) e a Mesa 2024 em acompanhamento. A ficha diz como a Camara decide; o painel de votacao acha
            //     a prestacao pelo PDL; o portal mostra as contas; a vereadora le a lista.
            try {
              const lst = await api(cSec, '/api/contas');
              const ps = Array.isArray(lst.body?.prestacoes) ? lst.body.prestacoes : [];
              const g24 = ps.find(x => x.tipo === 'governo_prefeito' && x.exercicio === 2024);
              const g23 = ps.find(x => x.tipo === 'governo_prefeito' && x.exercicio === 2023);
              const ficha = g24 ? await api(cSec, `/api/contas/${g24.id}`) : { status: 0, body: null };
              const pdl = ficha.body?.proposicao?.id;
              const porPdl = pdl ? await api(cSec, `/api/contas-da-proposicao/${pdl}`) : { status: 0 };
              const ver = await api(cVer, '/api/contas');
              let tf = '';
              if (g24) {
                const p = await cSec.newPage();
                await p.goto(`${B}/contas/${g24.id}`, { waitUntil: 'domcontentloaded', timeout: 30000 });
                await p.waitForTimeout(3000);
                tf = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
                await p.close();
              }
              const anon = await browser.newContext({ locale: 'pt-BR' });
              const pub = await api(anon, `/api/portal/casa/${E}/contas`);
              const pg = await anon.newPage();
              await pg.goto(`${B}/portal/casa/${E}/contas`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await pg.waitForTimeout(3000);
              const tp = (await pg.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await anon.close();
              const ok = lst.status === 200 && ps.length >= 3 && g24?.estado === 'pronta_para_pauta' && g23?.estado === 'julgada'
                && ficha.status === 200 && ficha.body?.pautavel === true && (ficha.body?.quorum?.['necessarios-para-rejeitar'] ?? 0) >= 1
                && porPdl.status === 200 && ver.status === 200
                && /Como a C[aâ]mara decide/i.test(tf) && pub.status === 200 && (pub.body?.prestacoes?.length ?? 0) >= 2
                && /Contas/i.test(tp) && !/Application error|Internal Server/i.test(tf + tp);
              rec('julgamento das contas', ok ? 'OK' : 'ERRO',
                  `lista=${lst.status}:${ps.length} 2024=${g24?.estado ?? '-'} 2023=${g23?.estado ?? '-'} ficha=${ficha.status} pautavel=${ficha.body?.pautavel} por-pdl=${porPdl.status} vereadora=${ver.status} portal=${pub.status}:${pub.body?.prestacoes?.length ?? '-'}`);
            } catch (e) { rec('julgamento das contas', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 12) OBRIGACOES LEGAIS NO MOTOR (ADR-0021 fatia 3) — ler o painel aciona o gatilho: a audiencia de metas
            //     fiscais e o julgamento das contas aparecem como obrigacoes da Casa (a demo esta' ligada desde 01/01/2026)
            try {
              const pn = await api(cSec, '/api/compliance/painel');
              const ab = Array.isArray(pn.body?.['em-aberto']) ? pn.body['em-aberto'] : [];
              const metas = ab.filter(x => x['template-chave'] === 'audiencia_metas_fiscais');
              const contas = ab.filter(x => x['template-chave'] === 'julgamento_contas_prefeito');
              const ok = pn.status === 200 && metas.length >= 1 && contas.length >= 1;
              rec('obrigacoes legais (motor)', ok ? 'OK' : 'ERRO',
                  `painel=${pn.status} em-aberto=${ab.length} metas-fiscais=${metas.map(x => `${x['vence-em']}:${x.estado}`).join(',') || '-'} contas=${contas.map(x => `${x['vence-em']}:${x.estado}`).join(',') || '-'}`);
            } catch (e) { rec('obrigacoes legais (motor)', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 13) BALCAO DE ATENDIMENTO (e-SIC, ouvidoria, LGPD) — a demo deixa um protocolo aberto em cada fila; a
            //     secretaria le as tres e o detalhe; a ouvidoria nunca expoe quem se manifestou (Lei 13.460 art. 10 §7);
            //     a vereadora nao entra no balcao.
            try {
              const fe = await api(cSec, '/api/atendimento/esic');
              const fo = await api(cSec, '/api/atendimento/ouvidoria');
              const fl = await api(cSec, '/api/atendimento/lgpd');
              const ie = fe.body?.itens ?? [], io = fo.body?.itens ?? [], il = fl.body?.itens ?? [];
              const de = ie[0] ? await api(cSec, `/api/atendimento/esic/${ie[0].id}`) : { status: 0, body: null };
              const dout = io[0] ? await api(cSec, `/api/atendimento/ouvidoria/${io[0].id}`) : { status: 0, body: null };
              // Os ids saem do texto antes de procurar CPF: o uuid da demo e' so' digito (…-000000000420) e casava
              // com o padrao de CPF, reprovando o sigilo sem vazamento nenhum.
              const semIds = JSON.stringify(dout.body || {})
                .replace(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/gi, '');
              const sigilo = dout.body && !('manifestante' in dout.body) && !('requerente' in dout.body)
                && !/\d{3}\.?\d{3}\.?\d{3}-?\d{2}/.test(semIds);
              const ver = await api(cVer, '/api/atendimento/esic');
              const p = await cSec.newPage();
              await p.goto(`${B}/atendimento`, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await p.waitForTimeout(3000);
              const t = (await p.evaluate(() => document.body?.innerText || '')).replace(/\s+/g,' ').trim();
              await p.close();
              const ok = fe.status === 200 && fo.status === 200 && fl.status === 200
                && ie.length >= 1 && io.length >= 1 && il.length >= 1
                && de.status === 200 && Array.isArray(de.body?.historico) && dout.status === 200 && sigilo
                && ver.status === 403 && /Atendimento ao cidad/i.test(t) && !/Application error|Internal Server/i.test(t);
              rec('balcao de atendimento', ok ? 'OK' : 'ERRO',
                  `esic=${fe.status}:${ie.length} ouvidoria=${fo.status}:${io.length} lgpd=${fl.status}:${il.length} detalhe-esic=${de.status} detalhe-ouv=${dout.status} sigilo=${sigilo} vereadora=${ver.status} tela=${/Atendimento ao cidad/i.test(t)}`);
            } catch (e) { rec('balcao de atendimento', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 14) ENVIO DE ARQUIVO (parser comum de upload) — SEM gravar nada: a secretaria envia um documento de contas a uma
            //     prestacao que NAO existe. O parser le o arquivo inteiro ANTES de alguem procurar a prestacao, entao:
            //     404 "nao encontrada" = o parser aceitou (nada sobe ao storage nem ao banco); 400 "malformado" = o parser
            //     recusou. Nome de 254 caracteres acentuados (477 bytes): o bloco de cabecalhos da parte passa de 512 bytes, o
            //     teto padrao da commons-fileupload2 que derrubava esse envio com 400.
            //     O controle: um cabecalho de parte de 4 KB TEM de voltar 400 — prova que o pedido chegou ao parser (se a rota
            //     respondesse 404 antes de ler o corpo, os dois dariam 404 e o caso reprovaria). O corpo e' montado a mao com
            //     o nome em UTF-8 cru, como o navegador manda.
            try {
              const fronteira = '----fumacaOplenario';
              const corpo = (nome, extra = []) => Buffer.from(
                `--${fronteira}\r\nContent-Disposition: form-data; name="arquivo"; filename="${nome}"\r\n`
                + ['Content-Type: application/pdf', ...extra].map(h => h + '\r\n').join('')
                + `\r\n%PDF-1.7 fumaca\r\n--${fronteira}--\r\n`, 'utf8');
              const enviar = async (buf) => {
                const r = await cSec.request.post(`${B}/api/contas/${crypto.randomUUID()}/documentos?tipo=outro`, {
                  headers: { 'content-type': `multipart/form-data; boundary=${fronteira}`, accept: 'application/json' },
                  data: buf, timeout: 25000 });
                let j = null; try { j = await r.json(); } catch {}
                return { status: r.status(), erro: j?.erro ?? '' };
              };
              const nomeLongo = 'Ofício de prestação de contas ' + 'çã'.repeat(110) + '.pdf';
              const longo = await enviar(corpo(nomeLongo));
              const grande = await enviar(corpo('oficio.pdf', ['X-Preenchimento: ' + 'a'.repeat(4096)]));
              const ok = longo.status === 404 && /n[aã]o encontrada/i.test(longo.erro) && grande.status === 400;
              rec('envio de arquivo (parser)', ok ? 'OK' : 'ERRO',
                  `nome-longo(${[...nomeLongo].length} car, ${Buffer.byteLength(nomeLongo)} bytes)=${longo.status} "${longo.erro}" cabecalho-4KB=${grande.status} "${grande.erro}"`);
            } catch (e) { rec('envio de arquivo (parser)', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            // 15) COMPLEMENTO DA RESPOSTA (ADR-0022) — SEM gravar nada: a rota existe, le o corpo e recusa o que nao cabe.
            //     - protocolo que nao existe -> 404 "nao encontrado" (texto valido: passou pela validacao e pela Casa);
            //     - o controle: texto so' de espacos -> 400. A validacao vem antes da busca, entao os dois pedidos ao mesmo
            //       protocolo inexistente so' diferem pelo corpo: se a rota respondesse sem ler o corpo, dariam o mesmo status;
            //     - protocolo AINDA ABERTO (acoes.pode-complementar = false no detalhe) -> 409 em palavras. So' e' enviado a
            //       um protocolo que o proprio detalhe diz que nao aceita: nunca a um ja' respondido, que gravaria;
            //     - a vereadora -> 403.
            try {
              const postar = async (ctx, id, corpo) => {
                const r = await ctx.request.post(`${B}/api/atendimento/esic/${id}/complementos`, {
                  headers: { 'content-type': 'application/json', accept: 'application/json' },
                  data: JSON.stringify({ corpo }), timeout: 25000 });
                let j = null; try { j = await r.json(); } catch {}
                return { status: r.status(), erro: j?.erro ?? '' };
              };
              const fantasma = crypto.randomUUID();
              const inexistente = await postar(cSec, fantasma, 'fumaça: complemento a um protocolo que não existe');
              const vazio = await postar(cSec, fantasma, '   ');
              const ver = await postar(cVer, fantasma, 'fumaça');
              const fila = (await api(cSec, '/api/atendimento/esic')).body?.itens ?? [];
              let aberto = null, chave = false;
              for (const it of fila) {
                const d = await api(cSec, `/api/atendimento/esic/${it.id}`);
                const pode = d.body?.acoes?.['pode-complementar'];
                if (typeof pode === 'boolean') chave = true;
                if (pode === false) { aberto = it.id; break; }
              }
              const semResposta = aberto ? await postar(cSec, aberto, 'fumaça: complemento a um protocolo ainda aberto') : null;
              const ok = inexistente.status === 404 && /n[aã]o encontrado/i.test(inexistente.erro)
                && vazio.status === 400 && ver.status === 403 && chave
                && (!semResposta || (semResposta.status === 409 && /antes de complementar/i.test(semResposta.erro)));
              rec('complemento da resposta', ok ? 'OK' : 'ERRO',
                  `inexistente=${inexistente.status} "${inexistente.erro}" vazio=${vazio.status} vereadora=${ver.status} pode-complementar-no-detalhe=${chave} aberto=${semResposta ? `${semResposta.status} "${semResposta.erro}"` : 'nenhum protocolo aberto na fila'}`);
            } catch (e) { rec('complemento da resposta', 'ERRO', String(e).split('\n')[0].slice(0,140)); }

            console.log('\n===== RESUMO FUMACA =====');
            for (const r of R) console.log(`  [${r.flag}] ${r.tela} — ${r.nota}`);
            console.log('== fumaca concluida ==');
            if (!okSec || !okVer || R.some(r => r.flag === 'ERRO')) process.exitCode = 1;
          } finally { await browser.close(); }
          JS
      - name: Rodar fumaca
        env:
          SEC_ID: ${{ inputs.secretaria }}
          VER_ID: ${{ inputs.vereadora }}
        run: node fumaca.mjs
