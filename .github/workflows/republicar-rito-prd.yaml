name: Rito da faixa do portal nas materias antigas (prd)

# A faixa "Onde este projeto esta'" da ficha publica segue o rito da Casa desde a mig 20261005000262, mas so' para a
# materia que teve evento (protocolo ou transicao) depois dela; a anterior ficou no mapa fixo. Este job roda a carga
# (`portal-republicar-rito`, o comando da propria imagem da API) para uma Casa: calcula o rito como o evento o levaria
# e grava so' onde falta. Idempotente: rodar de novo nao troca nada. So' projecao do portal; nenhuma linha da Casa muda.
# Mesma conexao do passo `migrate` do build-api-prd.yaml e do configurar-ia-prd.yaml.
#
# So' workflow_dispatch, e DEPOIS da promocao que leva o comando para a imagem da API.

on:
  workflow_dispatch:
    inputs:
      ente:
        description: 'A Camara (ente-id)'
        required: true
        default: '10000000-0000-0000-0000-000000000001'
        type: string

jobs:
  republicar:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: republicar-rito-prd
      cancel-in-progress: false
    env:
      ENTE: ${{ inputs.ente }}
    steps:
      - name: Conferir o ente
        run: |
          [[ "$ENTE" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] \
            || { echo "::error::ente nao e' um UUID"; exit 1; }

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Gravar o rito nas materias sem
        env:
          APP_ENV: production
          DATABASE_URL: jdbc:postgresql://204.12.227.116:5433/oplenario
          DB_USER: oplenario-application
          DB_PASSWORD: ${{ secrets.HML_DB_PASSWORD }}
        run: |
          docker run --rm -e APP_ENV -e DATABASE_URL -e DB_USER -e DB_PASSWORD \
            ghcr.io/gondwanadev/oplenario-api-prd:latest portal-republicar-rito "$ENTE"
