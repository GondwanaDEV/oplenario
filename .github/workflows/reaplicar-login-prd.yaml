name: Reaplicar o login das Camaras (prd)

# ADR-0025, docs/27 secao 9, passo 3: grava no realm de cada Camara do registro o nome, o pt-BR, o tema de login e de
# e-mail, a politica de senha, a trava contra forca bruta e a ordem senha -> codigo do primeiro acesso. E' o botao
# "Reaplicar configuracao de login" do console, pela linha de comando (`reaplicar-login` da imagem da API), Casa a Casa,
# com o par tentativa/desfecho na atuacao da Operacao. Idempotente: rodar de novo so' reconverge.
#
# O provisionamento grava TAMBEM o SMTP e o gov.br do realm a partir da config de quem roda. Por isso o comando roda
# com o ambiente da API de producao, lido do Dokploy (nunca com valores escritos aqui); so' o banco troca para a porta
# externa (a mesma do `migrate` do build-api-prd). Em producao a API fala com o Keycloak pela rede interna do Dokploy
# (nome do container), fora do alcance do runner: o job usa entao a URL publica (KEYCLOAK_BASE_URL_PUBLICO) e deixa o
# gov.br do realm como esta' (as URLs do broker saem da base interna). Se nenhuma das duas responde, para antes de tocar
# em qualquer coisa.
#
# NUNCA automatico: so' workflow_dispatch, e ainda assim com a frase de confirmacao. Rodar DEPOIS da promocao que leva o
# comando para a imagem da API (o job confere isso antes) e, de preferencia, depois do build-keycloak-prd: sem o tema
# na imagem do Keycloak, o realm aponta para ele e o Keycloak cai no padrao (com um erro no log) ate' o tema chegar.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite reaplicar-login para confirmar'
        required: true
        type: string
      ente:
        description: 'So esta Camara (ente-id). Vazio = todas do registro (encerradas e em apagamento ficam de fora)'
        required: false
        default: ''
        type: string

jobs:
  reaplicar:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: reaplicar-login-prd
      cancel-in-progress: false
    env:
      DK: https://${{ vars.DOKPLOY_DOMAIN }}/api
      DK_KEY: ${{ secrets.DOKPLOY_KEY }}
      APP_CORE: ${{ secrets.DOKPLOY_APPLICATION_ID_API }}
      CONFIRMAR: ${{ inputs.confirmar }}
      ENTE: ${{ inputs.ente }}
      IMAGEM: ghcr.io/gondwanadev/oplenario-api-prd:latest
    steps:
      - name: Guarda de confirmacao
        run: |
          [ "$CONFIRMAR" = "reaplicar-login" ] || { echo "::error::confirmacao invalida"; exit 1; }
          if [ -n "$ENTE" ] && ! [[ "$ENTE" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::ente nao e' um UUID"; exit 1
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Uma imagem anterior a' promocao nao conhece `reaplicar-login` e cairia no `serve` (subiria uma API inteira aqui).
      # A sonda roda SEM nenhuma variavel de producao, com um argumento invalido: a imagem certa responde o uso e sai.
      - name: Conferir que a imagem da API tem o comando
        id: imagem
        run: |
          set -euo pipefail
          docker pull -q "$IMAGEM" > /dev/null
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGEM")
          saida=$(timeout 120 docker run --rm "$digest" reaplicar-login --ente sonda 2>&1 || true)
          if ! grep -q "uso: reaplicar-login" <<< "$saida"; then
            echo "::error::a imagem $digest nao tem o comando reaplicar-login: promova a main e espere o build-api-prd"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # O ambiente da API como o Dokploy o guarda. Sai so' o NOME das chaves que importam aqui; os valores ficam no
      # arquivo do runner (e os que parecem segredo, mascarados no log).
      - name: Ambiente da API de producao (Dokploy)
        run: |
          set -euo pipefail
          umask 077
          curl --fail-with-body -sS -H "x-api-key: $DK_KEY" -H 'accept: application/json' \
            "$DK/application.one?applicationId=$APP_CORE" | jq -r '.env // ""' > "$RUNNER_TEMP/api.env.bruto"
          python3 - "$RUNNER_TEMP/api.env.bruto" "$RUNNER_TEMP/api.env" <<'PY'
          import re, sys
          trocadas = {"DATABASE_URL", "DB_USER", "DB_PASSWORD"}
          segredo = re.compile(r"SENHA|PASSWORD|SECRET|TOKEN|_KEY$")
          saida, nomes = [], []
          for linha in open(sys.argv[1], encoding="utf-8").read().splitlines():
              s = linha.strip()
              if not s or s.startswith("#"):
                  continue
              if s.startswith("export "):
                  s = s[7:].lstrip()
              m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*)=(.*)$", s)
              if not m:
                  continue
              k, v = m.group(1), m.group(2)
              if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                  v = v[1:-1]
              if segredo.search(k) and v:
                  print(f"::add-mask::{v}")
              if k in trocadas:
                  continue
              saida.append(f"{k}={v}")
              nomes.append(k)
          open(sys.argv[2], "w", encoding="utf-8").write("\n".join(saida) + "\n")
          relevantes = sorted(n for n in nomes if n.startswith(("KEYCLOAK_", "GOVBR_", "APP_ENV")))
          print("chaves da API usadas pelo provisionamento:", ", ".join(relevantes) or "(nenhuma)")
          if "KEYCLOAK_BASE_URL" not in nomes:
              print("::error::a API nao tem KEYCLOAK_BASE_URL no Dokploy")
              sys.exit(1)
          PY
          valor() { grep "^$1=" "$RUNNER_TEMP/api.env" | head -1 | cut -d= -f2-; }
          kc=$(valor KEYCLOAK_BASE_URL)
          echo "Keycloak da API: $kc"
          if ! curl -sf -o /dev/null --max-time 20 "$kc/realms/master"; then
            # A API fala com o Keycloak pela rede interna do Dokploy (nome do container), que o runner nao alcanca. O
            # admin do Keycloak e' o mesmo pela URL publica (a mesma do semear-hml). O que muda com a base: so' o broker
            # do gov.br, cujas URLs saem dela (emissor e token pela interna) — por isso as GOVBR_* ficam de fora e o
            # gov.br do realm NAO e' reconvergido daqui: o que a API gravou nele fica como esta'.
            pub=$(valor KEYCLOAK_BASE_URL_PUBLICO)
            pub=${pub:-https://keycloak.calvetec.com.br}
            if [ -z "$pub" ] || ! curl -sf -o /dev/null --max-time 20 "$pub/realms/master"; then
              echo "::error::nem o Keycloak interno ($kc) nem o publico (${pub:-ausente}) respondem daqui: nada foi tocado"
              exit 1
            fi
            echo "Keycloak interno fora de alcance daqui; usando o publico ($pub), sem reconvergir o gov.br do realm"
            grep -v -e '^KEYCLOAK_BASE_URL=' -e '^GOVBR_' "$RUNNER_TEMP/api.env" > "$RUNNER_TEMP/api.env.novo" || true
            echo "KEYCLOAK_BASE_URL=$pub" >> "$RUNNER_TEMP/api.env.novo"
            mv "$RUNNER_TEMP/api.env.novo" "$RUNNER_TEMP/api.env"
          fi

      - name: Reaplicar
        env:
          DB_PASSWORD: ${{ secrets.HML_DB_PASSWORD }}
          DIGEST: ${{ steps.imagem.outputs.digest }}
        run: |
          set -euo pipefail
          args=(reaplicar-login)
          [ -n "$ENTE" ] && args+=(--ente "$ENTE")
          docker run --rm --env-file "$RUNNER_TEMP/api.env" \
            -e DATABASE_URL=jdbc:postgresql://204.12.227.116:5433/oplenario \
            -e DB_USER=oplenario-application -e DB_PASSWORD \
            "$DIGEST" "${args[@]}"

      - name: Limpar
        if: always()
        run: rm -f "$RUNNER_TEMP/api.env" "$RUNNER_TEMP/api.env.bruto"
