# Stack local do projeto (§22.9 Eixo 5: Docker em todo deploy local/test).
# Rodar:  docker compose up --build         (portas do host via .env — ver .env.example)
# Auth:   docker compose --profile auth up   (sobe o Keycloak; F0 nao usa, fica de fora por padrao)
# O servico `migrate` aplica as migrations e sai antes do `app` (serve nao migra — §22.9, evita
# corrida de migration entre replicas). O `app` so sobe depois do Postgres saudavel + migrate ok.
name: oplenario

services:
  postgres:
    image: postgres:16
    # T1.1: sem politica de restart a plataforma NAO voltava sozinha — parar o Docker e religar deixava
    # os seis servicos de infra `Exited` e so' o `app` de pe', em crash-loop contra um banco ausente.
    restart: unless-stopped
    environment: { POSTGRES_USER: oplenario, POSTGRES_PASSWORD: dev, POSTGRES_DB: oplenario }
    ports: ["${OPLENARIO_PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oplenario -d oplenario"]
      interval: 5s
      timeout: 3s
      retries: 12

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    ports: ["${OPLENARIO_VALKEY_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    # A MinIO parou de publicar imagem da edicao comunitaria. Primeiro sumiu o namespace `minio/*` do Docker
    # Hub (15/09/2026: API de tags -> 404, `pull access denied` no 1o run de CI); depois o `quay.io/minio/minio`
    # passou a negar o pull anonimo (24/09/2026: `unauthorized: access to the requested resource is not
    # authorized` no CI, com o keycloak do MESMO registro puxando normalmente). `pgsty/minio` e' o fork
    # comunitario mantido pelo Pigsty, publicado no Docker Hub com tag versionada: na tag abaixo o binario
    # ainda e' `minio`, o entrypoint prefixa `minio` quando o comando comeca com `server`, e a imagem traz o
    # `curl` que o healthcheck usa (conferido no Dockerfile.goreleaser e no docker-entrypoint.sh da tag). Tag
    # FIXADA (nunca `:latest`): o `master` do fork ja' renomeou o binario para `silo`.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: oplenario, MINIO_ROOT_PASSWORD: dev12345 }
    # healthcheck OBRIGATORIO junto com `unless-stopped`: sem ele o container em crash-loop aparece
    # "Up" no `ps` (a mesma razao ja' escrita no service `app`). Regra do proprio arquivo, agora
    # aplicada onde ela vale.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports:
      - "${OPLENARIO_MINIO_PORT:-9000}:9000"
      - "${OPLENARIO_MINIO_CONSOLE_PORT:-9001}:9001"

  # Auth: docker compose --profile auth up (sobe o Keycloak; adapter real desde Onda D Slice 1).
  # 1o boot demora ~3-5min (Quarkus augmentation + schema do banco embutido) -- espere o healthcheck,
  # nao assuma pronto so' porque o container "started". Porta 8080 pode colidir com outro projeto local
  # -- use OPLENARIO_KEYCLOAK_PORT (+ KEYCLOAK_BASE_URL do app apontando pra' mesma porta) se precisar.
  # SEM `restart:` de proposito. Politica de restart e' do dockerd e IGNORA `profiles` — com
  # `unless-stopped` o keycloak voltaria no religar do daemon mesmo sem `--profile auth`, e ~500 MiB
  # a mais numa VM de 3.9 GiB e' exatamente o que derrubou o Postgres por OOM (ledger, Fase 7).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev
    environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
    ports: ["${OPLENARIO_KEYCLOAK_PORT:-8080}:8080"]
    profiles: ["auth"]

  # Captura de e-mail em dev/CI: o Keycloak manda o convite p/ ca' e nada sai p/ o mundo.
  # Caixa em http://localhost:${OPLENARIO_MAILPIT_PORT:-8025}. API: /api/v1/messages.
  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "${OPLENARIO_MAILPIT_PORT:-8025}:8025"   # UI/API
      - "${OPLENARIO_SMTP_PORT:-1025}:1025"      # SMTP
    profiles: ["auth"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # CARRY CONHECIDO (T1.1/A2, 08/09/2026): politica de restart e' do dockerd, e no religar do daemon o
  # `depends_on` NAO e' honrado — o `app` volta sozinho enquanto este `migrate` (one-shot, `restart: no`,
  # correto) nao re-executa. Com imagem nova + migration pendente, o app sobe contra schema velho e o
  # sintoma vira `relation ... does not exist` longe da causa. O conserto natural — o `serve` checar
  # migrations pendentes e falhar fechado — foi TENTADO e nao passa: o papel do app nao tem sequer
  # `USAGE` em `public` (least privilege), entao `migratus/pending-list` morre com
  # `permission denied for schema public`. Fecha-lo exige conceder leitura do ledger de migrations ao
  # papel do app — decisao de seguranca, nao de conveniencia. Ate la': depois de um `--build` com
  # migration nova, subir com `docker compose up -d` (que honra o depends_on), nunca so' religar o Docker.
  migrate:
    image: oplenario-backend:local
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/oplenario"
    command: ["migrate"]
    restart: "no"

  app:
    image: oplenario-backend:local
    build: .
    # A JVM morreu com SIGBUS (BUS_ADRERR) escrevendo no proprio /tmp/hsperfdata_root/1 — o arquivo de
    # perf-data que ela mapeia em memoria — sob OrbStack/aarch64. Nao e' falha da aplicacao: o endereco
    # do siginfo cai DENTRO do mapeamento desse arquivo. `restart` traz o servico de volta se acontecer
    # de novo (sem isto o container fica morto e a stack inteira 500a em silencio, o modo de falha que
    # inutilizaria uma apresentacao).
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      # -XX:-UsePerfData desliga a criacao/mapeamento de /tmp/hsperfdata_root/<pid>, a origem exata do
      # SIGBUS acima. Custo: `jstat`/`jcmd` locais deixam de enxergar este processo. Nenhum efeito
      # funcional — nada no projeto depende de perf-data.
      JAVA_TOOL_OPTIONS: "-XX:-UsePerfData"
      DATABASE_URL: "jdbc:postgresql://postgres:5432/oplenario"
      # o app de runtime conecta como o role LOGIN NOBYPASSRLS (defesa em profundidade, F1.0);
      # o servico `migrate` segue como o dono (superuser do POSTGRES_USER) p/ rodar DDL. Senha = DEV.
      DB_USER: "oplenario_pool"
      DB_PASSWORD: "oplenario_dev_pool"
      VALKEY_URI: "redis://valkey:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      # Onda D Slice 2 (T17): split-horizon do Keycloak. base-url INTERNO = DNS do compose (o app resolve
      # `keycloak` p/ o container; localhost dentro do container seria o proprio app). Este e' o URL do
      # allowlist de issuer + fetch de JWKS — e o issuer dos tokens fica `http://keycloak:8080/realms/...`
      # (a sessao e' mintada pelo token-exchange server-side, que tb usa este host). base-url-PUBLICO =
      # o que a descoberta devolve pro BROWSER redirecionar (host, porta mapeada do KC).
      # Onda D Slice 2 (T17): seletor do IdP (sistema/idp-para). dev/test => idp-dev (confia no dev-token
      # claims-JSON, `?token=`); qualquer outro valor => KeycloakIdp REAL (verifica JWT/JWKS). Default `dev`
      # preserva o stack normal (dev-token). Rodar o perfil `auth` com OPLENARIO_APP_ENV=production p/ ligar
      # o IdP real e provar o login PKCE ao vivo (o dev-token deixa de valer nesse modo — e' o esperado).
      APP_ENV: "${OPLENARIO_APP_ENV:-dev}"
      KEYCLOAK_BASE_URL: "http://keycloak:8080"
      # PUBLICO = mesmo host `keycloak:8080` (o /etc/hosts do dev mapeia keycloak->127.0.0.1). Assim o issuer
      # do token (derivado do host que o browser usou) fica http://keycloak:8080/... — IGUAL ao base-url
      # interno -> passa no allowlist E o JWKS e' alcancavel do container (DNS do compose). Unico nome que
      # resolve pro KC tanto no browser (host) quanto nos containers.
      KEYCLOAK_BASE_URL_PUBLICO: "http://keycloak:8080"
    ports: ["${OPLENARIO_APP_PORT:-8888}:8888"]
    # Sem healthcheck, `restart: unless-stopped` esconde crash-loop: o container aparece "Up" enquanto
    # reinicia em laco, e so' a contagem de restarts denuncia. Com ele, `docker compose ps` diz
    # "unhealthy" de cara — a visibilidade que o restart automatico tira, devolvida.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/saude || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 40s
    # ── Login PKCE REAL (perfil `auth`) ──────────────────────────────────────────────────────────
    # Requer: (1) /etc/hosts com `127.0.0.1 keycloak` — browser E containers precisam resolver o MESMO
    #   host `keycloak` p/ o issuer do token bater com o JWKS alcançável do container;
    # (2) subir com `OPLENARIO_APP_ENV=production docker compose --profile auth up -d` — liga o
    #   KeycloakIdp real (o dev-token deixa de valer nesse modo, é o esperado).
    # No modo dev normal (sem `--profile auth`) o dev-token continua valendo.

  frontend:
    image: oplenario-frontend:local
    restart: unless-stopped
    # healthcheck OBRIGATORIO junto com `unless-stopped` (mesma regra do `app`). `start_period` largo
    # porque o `next dev` compila a rota `/` sob demanda no 1o acesso — medido em ~46s com o cache
    # vazio, e mais sob contencao de CPU. `wget` vem do busybox da imagem node:alpine.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 6
      start_period: 180s
    build:
      context: ../frontend
      target: dev
    depends_on: [app]
    environment:
      # nome do service (DNS interno do compose), nao localhost — a rota /api/* do Next proxeia p/ ca.
      BACKEND_URL: "http://app:8888"
      # MODO DE AUTH DO FE (src/lib/modo.ts) — MESMA variavel que alimenta o APP_ENV do service `app` acima,
      # de proposito: as duas pontas TEM de andar juntas. `OPLENARIO_APP_ENV=production docker compose up`
      # poe backend E frontend em modo real de uma vez (o dev-token deixa de valer nos dois). Default `dev`
      # preserva o stack normal. Sem isto o FE decidia o modo pelo NODE_ENV do BUILD (`next dev` =>
      # "development" => modo dev sempre), e o caminho de producao do FE era inexercitavel localmente:
      # com o backend em APP_ENV=production e cookie de sessao VALIDO, os hooks abortavam antes de buscar.
      NEXT_PUBLIC_APP_ENV: "${OPLENARIO_APP_ENV:-dev}"
      # Onda D Slice 2 (T17): o callback BFF troca `code`->token SERVER-SIDE; usa o DNS interno do compose
      # (o browser autorizou em localhost:8080, mas o container nao resolve localhost como o KC). Casa com
      # o KEYCLOAK_BASE_URL do app -> issuer consistente (http://keycloak:8080/realms/...).
      KEYCLOAK_INTERNAL_URL: "http://keycloak:8080"
      # Onda D Slice 2 (T17): origin publica canonica p/ montar o redirect_uri do PKCE. Sem isto o Next dev
      # em container cai p/ request.nextUrl.origin = http://0.0.0.0:3000 (bind do server), que NAO casa com
      # o redirectUri registrado no client (http://localhost:3000/...) -> KC rejeita "Invalid redirect_uri".
      # Login (authorize) e callback (token-exchange) usam o MESMO helper -> redirect_uri identico byte-a-byte.
      APP_ORIGIN: "http://localhost:3000"
      # Onda D Slice 2b: host-pin do RP-logout. O baseUrl do cookie sessao_kc (browser-facing) é validado
      # contra ESTE origin — mesmo host público que a descoberta devolve (base-url-publico). Um cookie forjado
      # com outro host cai no logout local em vez de redirecionar p/ fora.
      KEYCLOAK_PUBLIC_URL: "http://keycloak:8080"
    volumes:
      - ../frontend:/app
      # anonimos: preservam o node_modules/.next instalados na imagem (linux) em vez do host (macOS/arm nativo).
      - /app/node_modules
      - /app/.next
    ports: ["${OPLENARIO_FRONTEND_PORT:-3000}:3000"]
