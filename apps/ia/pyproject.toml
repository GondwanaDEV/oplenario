[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oplenario-ia"
version = "0.1.0"
description = "Plataforma de IA do O Plenário — satélite (§22.2, §22.3, §22.11). Ver docs/adr/0006."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "anthropic>=1.8,<2",
  "httpx>=0.27,<1",                # cliente do core (ADR-0008)
  "psycopg[binary]>=3.2,<4",       # armazenamento próprio do satélite (schema `ia`)
]

[project.optional-dependencies]
# ASR + diarização self-host (Faixa A / A.3). Pesado: fora do CI e do padrão de deploy, que usam o fake.
asr = [
  "sherpa-onnx>=1.13,<2",
  "numpy>=2,<3",
  "imageio-ffmpeg>=0.6,<1",
]
dev = [
  "pytest>=8",
  "ruff>=0.16,<0.17",  # fixados: formatter/lint novos mudariam o veredito do CI sem mudança de código
  "mypy>=2.3,<3",
]

[project.scripts]
oplenario-ia-avaliar = "oplenario_ia.avaliacao.cli:main"
oplenario-ia-trabalhador = "oplenario_ia.trabalhador_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oplenario_ia = ["py.typed", "avaliacao/precos.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos do português em strings/docstrings/comentários

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sherpa_onnx", "imageio_ffmpeg", "numpy"]
ignore_missing_imports = true
