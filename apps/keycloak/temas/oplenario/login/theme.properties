# O Plenário · tema de login do Keycloak (ADR-0024).
#
# Quem entra numa Câmara vê o O Plenário, nunca o Keycloak: mesmo cartão, mesma faixa de azulejo, mesmas cores e
# fontes do arquétipo `produto/design-system/o-plenario/telas/login.html` (a Câmara lidera a marca; "O Plenário" recua
# ao rodapé). Herda as páginas do tema `base` (HTML sem estilo) e só reescreve a moldura (template.ftl) e a página de
# senha (login.ftl). Toda outra página do Keycloak — código do autenticador, criar senha, erro, página expirada —
# entra na moldura e pega as classes abaixo.
#
# As fontes em resources/fontes/ são CÓPIA de apps/frontend/public/fontes/ (mesmos arquivos): trocar a fonte do
# produto é trocar nos dois lugares.
parent=base
import=common/keycloak

styles=css/oplenario.css
locales=pt-BR

