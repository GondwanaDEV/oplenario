# stack local/test (§22.9 Eixo 5: Docker em todo deploy local/test)
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: oplenario, POSTGRES_PASSWORD: dev, POSTGRES_DB: oplenario }
    ports: ["5432:5432"]
  valkey:
    image: valkey/valkey:8
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: oplenario, MINIO_ROOT_PASSWORD: dev12345 }
    ports: ["9000:9000", "9001:9001"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev
    environment: { KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin }
    ports: ["8080:8080"]
  app:
    build: .
    depends_on: [postgres, valkey, minio, keycloak]
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/oplenario"
      VALKEY_URI: "redis://valkey:6379"
      MINIO_ENDPOINT: "http://minio:9000"
      KEYCLOAK_URL: "http://keycloak:8080"
    ports: ["8888:8888"]
